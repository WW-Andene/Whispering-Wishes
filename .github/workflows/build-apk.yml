name: Build APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        working-directory: app
        run: npm install

      - name: Build web app
        working-directory: app
        run: npm run build

      - name: Install Capacitor
        working-directory: app
        run: npm install --save @capacitor/core @capacitor/cli @capacitor/android

      - name: Create Capacitor config
        working-directory: app
        run: |
          cat > capacitor.config.json <<'EOF'
          {"appId":"com.deployview.wwandene.whisperingwishes","appName":"Whispering Wishes","webDir":"dist","bundledWebRuntime":false}
          EOF

      - name: Add Android platform and sync
        working-directory: app
        run: |
          npx cap add android
          npx cap sync android

      - name: Build debug APK
        working-directory: app/android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: whispering-wishes-debug
          path: app/android/app/build/outputs/apk/debug/*.apk
