# ═══════════════════════════════════════════════════════════════════════════════
# Whispering Wishes — Automated Game Data Update
# Runs daily to check for new banners, characters, events, and weapons.
# Creates a branch with changes for manual review + merge.
# ═══════════════════════════════════════════════════════════════════════════════

name: Auto-Update Game Data

on:
  # Run daily at 10:00 UTC (after typical banner rotations happen)
  schedule:
    - cron: '0 10 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (no file changes)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'
      only:
        description: 'Only update specific category'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'banners'
          - 'events'
          - 'characters'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install agent dependencies
        working-directory: agent
        run: npm install

      - name: Run update agent
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
        run: |
          ARGS=""
          if [ "$DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "${{ github.event.inputs.only }}" != "all" ] && [ "${{ github.event.inputs.only }}" != "" ]; then
            ARGS="$ARGS --only=${{ github.event.inputs.only }}"
          fi
          ARGS="$ARGS --no-git"
          node index.js $ARGS

      - name: Check for changes
        id: check
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true' && github.event.inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[auto-update] Game data update"
          title: "[Auto-Update] Game Data Update"
          body: |
            ## Automated Game Data Update

            The WW Update Agent detected changes in Wuthering Waves game data and applied updates.

            **Please review the changes before merging.**

            ### What to check:
            - [ ] Banner characters and dates are correct
            - [ ] Event end dates match official schedule
            - [ ] New character/weapon data is accurate
            - [ ] No data integrity issues

            ---
            *Generated by WW Update Agent at ${{ github.event.repository.updated_at }}*
          branch: auto-update/game-data
          delete-branch: true
          labels: |
            auto-update
            game-data
