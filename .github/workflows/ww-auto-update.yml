# ═══════════════════════════════════════════════════════════════════════════════
# Whispering Wishes — Automated Game Data Update
# Runs daily to check for new banners, characters, events, and weapons.
# Creates a branch with changes for manual review + merge.
# ═══════════════════════════════════════════════════════════════════════════════

name: Auto-Update Game Data

on:
  schedule:
    # ── FULL UPDATE: Daily at 00:00 UTC ──────────────────────────────
    # Runs the complete pipeline: banners, events, characters, weapons,
    # images, builds, self-audit, and app improvements.
    - cron: '0 0 * * *'

    # ── MICRO UPDATE: Every 6 hours (06:00, 12:00, 18:00 UTC) ───────
    # Lightweight pass: event timers, banner expiry checks, quick fixes.
    # Avoids big clumps of workload by spreading changes across the day.
    - cron: '0 6,12,18 * * *'

    # ── ADAPTIVE: Every 2h (fills gaps for banner transitions) ───────
    # During normal periods, the agent checks urgency and exits in <5s.
    # During banner transitions (last 48h), these runs proceed as micro.
    - cron: '0 2,4,8,10,14,16,20,22 * * *'

  # Allow manual trigger from GitHub UI
  workflow_dispatch:
    inputs:
      mode:
        description: 'Update mode'
        required: false
        default: 'full'
        type: choice
        options:
          - 'full'
          - 'micro'
          - 'audit'
          - 'images'
          - 'dry-run'
      only:
        description: 'Only update specific category (full mode)'
        required: false
        default: 'all'
        type: choice
        options:
          - 'all'
          - 'banners'
          - 'events'
          - 'characters'
          - 'images'
          - 'audit'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install agent dependencies
        working-directory: agent
        run: npm install

      - name: Determine run mode
        id: mode
        run: |
          # Manual trigger uses the input mode
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "mode=${{ github.event.inputs.mode }}" >> $GITHUB_OUTPUT
          else
            # Scheduled: check which cron triggered
            HOUR=$(date -u +%H)
            if [ "$HOUR" = "00" ]; then
              echo "mode=full" >> $GITHUB_OUTPUT
            else
              echo "mode=micro" >> $GITHUB_OUTPUT
            fi
          fi

      - name: Run update agent
        working-directory: agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          IMGBB_API_KEY: ${{ secrets.IMGBB_API_KEY }}
          RUN_MODE: ${{ steps.mode.outputs.mode }}
        run: |
          ARGS="--no-git"

          case "$RUN_MODE" in
            "full")
              ARGS="$ARGS --mode=full"
              ;;
            "micro")
              ARGS="$ARGS --mode=micro"
              ;;
            "audit")
              ARGS="$ARGS --mode=audit"
              ;;
            "images")
              ARGS="$ARGS --only=images"
              ;;
            "dry-run")
              ARGS="$ARGS --dry-run --mode=full"
              ;;
          esac

          if [ "${{ github.event.inputs.only }}" != "all" ] && [ "${{ github.event.inputs.only }}" != "" ]; then
            ARGS="$ARGS --only=${{ github.event.inputs.only }}"
          fi

          node index.js $ARGS

      - name: Check for changes
        id: check
        run: |
          # Stage agent report files that may have been generated
          git add agent/run-report.md agent/CHANGELOG.md 2>/dev/null || true
          if [ -n "$(git status --porcelain)" ]; then
            echo "has_changes=true" >> $GITHUB_OUTPUT
            echo "Changed files:"
            git status --porcelain
          else
            echo "has_changes=false" >> $GITHUB_OUTPUT
          fi

      # Close stale agent PRs before creating a new one
      - name: Close stale auto-update PRs
        if: steps.check.outputs.has_changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          STALE=$(gh pr list --label "auto-update" --state open --json number,createdAt -q '.[] | select((.createdAt | fromdateiso8601) < (now - 43200)) | .number')
          for PR in $STALE; do
            echo "Closing stale PR #${PR}"
            gh pr close $PR --comment "Superseded by newer auto-update." || true
          done

      - name: Create Pull Request
        if: steps.check.outputs.has_changes == 'true'
        id: create-pr
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "[auto-update] ${{ steps.mode.outputs.mode }} update"
          title: "[Auto-Update] ${{ steps.mode.outputs.mode }} — Game Data Update"
          body: |
            ## Automated Game Data Update (${{ steps.mode.outputs.mode }} mode)

            The WW Update Agent detected changes and applied updates.

            **Mode:** `${{ steps.mode.outputs.mode }}`
            **Trigger:** ${{ github.event_name == 'schedule' && 'Scheduled cron' || 'Manual dispatch' }}

            ### Review checklist:
            - [ ] Banner characters and dates are correct
            - [ ] Event end dates match official schedule
            - [ ] New character/weapon data is accurate
            - [ ] Images are correct format and quality
            - [ ] Code changes (if any) don't break functionality
            - [ ] No data integrity issues

            ---
            *Generated by WW Update Agent*
          branch: auto-update/${{ steps.mode.outputs.mode }}
          delete-branch: true
          labels: |
            auto-update
            ${{ steps.mode.outputs.mode }}

      # ── Auto-merge micro PRs (low-risk: timer advances, quick fixes) ────
      # Micro updates only touch event dates and minor CSS — safe to merge
      # without manual review. Full/audit PRs still require human approval.
      - name: Auto-merge micro PR
        if: steps.mode.outputs.mode == 'micro' && steps.create-pr.outputs.pull-request-number
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUM=${{ steps.create-pr.outputs.pull-request-number }}
          echo "Auto-merging micro PR #${PR_NUM}"
          gh pr merge ${PR_NUM} --squash --auto --delete-branch || echo "Auto-merge not available (branch protection may require reviews)"

      # Stage evolution log if it was generated
      - name: Commit evolution log
        if: steps.check.outputs.has_changes == 'true'
        run: |
          if [ -f agent/evolution-log.md ]; then
            git add agent/evolution-log.md
            git diff --cached --quiet || git commit -m "[agent] Update evolution log"
          fi
