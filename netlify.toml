[build]
  base = "whispering-wishes-replit"
  command = "npm run build"
  publish = "dist"

[[redirects]]
  from = "/"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/"
  [headers.values]
    Content-Security-Policy = "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; img-src 'self' https://i.ibb.co https://ibb.co https://i.imgur.com https://cdn.discordapp.com https://media.discordapp.net https://pbs.twimg.com https://raw.githubusercontent.com"