<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>WW-B</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#0a0a0f;color:#e0e0e0;min-height:100vh;-webkit-tap-highlight-color:transparent}
header{background:#111118;border-bottom:1px solid #1e1e2a;padding:0 .5rem;display:flex;align-items:center;position:sticky;top:0;z-index:50;overflow-x:auto}
header .logo{font-size:14px;font-weight:700;color:#facc15;padding:.75rem .5rem;white-space:nowrap}
nav{display:flex;gap:0}
nav button{padding:.75rem .65rem;font-size:11px;background:none;border:none;cursor:pointer;white-space:nowrap;margin-bottom:-1px;font-family:inherit}
nav button.active{color:#facc15;font-weight:600;border-bottom:2px solid #facc15}
nav button:not(.active){color:#666;border-bottom:2px solid transparent}
main{max-width:640px;margin:0 auto;padding:1rem}
.card{background:#111118;border:1px solid #1e1e2a;border-radius:10px;padding:.75rem;margin-bottom:6px}
.metric{background:#0d0d14;border-radius:8px;padding:.75rem;text-align:center}
.badge{font-size:10px;font-weight:700;padding:1px 6px;border-radius:4px;text-transform:uppercase;display:inline-block}
.btn{font-size:13px;font-weight:600;padding:8px 18px;border-radius:8px;border:none;cursor:pointer}
.btn-gold{background:#facc15;color:#000}.btn-gold:disabled{background:#1e1e2a;color:#666;cursor:default}
.btn-green{background:#22c55e;color:#000}.btn-green:disabled{background:#1e1e2a;color:#666;cursor:default}
.btn-sm{font-size:11px;padding:4px 10px;border-radius:6px;border:none;cursor:pointer}
.diff-old{font-size:10px;color:#ef4444;background:#1c0a0a;padding:3px 6px;border-radius:4px;margin-bottom:2px;font-family:monospace;max-height:40px;overflow:hidden;white-space:pre-wrap}
.diff-new{font-size:10px;color:#22c55e;background:#052e16;padding:3px 6px;border-radius:4px;font-family:monospace;max-height:40px;overflow:hidden;white-space:pre-wrap}
textarea{width:100%;background:#0a0a0f;color:#e0e0e0;border:1px solid #1e1e2a;border-radius:8px;padding:10px 12px;font-size:14px;font-family:inherit;resize:vertical;outline:none;line-height:1.5}
input[type=checkbox]{accent-color:#22c55e}
.empty{text-align:center;padding:3rem;color:#666}
.empty h3{font-size:16px;margin-bottom:8px}
.empty p{font-size:12px}
.quick-btn{font-size:11px;padding:6px 10px;border-radius:8px;border:1px solid #1e1e2a;background:#111118;color:#ccc;cursor:pointer;white-space:nowrap}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@babel/standalone/babel.min.js"></script>
<script type="text/babel">
const {useState, useEffect, useCallback} = React;
const api = (path, body) => fetch('/api' + path, body ? {method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)} : {}).then(r=>r.json());

// ═══ HOME ═══════════════════════════════════════════════════════════════════
function HomePage({go}) {
  const [stats, setStats] = useState(null);
  const [runs, setRuns] = useState([]);
  useEffect(() => { Promise.all([api('/stats'), api('/runs?limit=5')]).then(([s,r]) => {setStats(s);setRuns(r)}); }, []);
  if (!stats) return <div className="empty"><p>Loading...</p></div>;
  return <>
    <h2 style={{fontSize:16,fontWeight:600,marginBottom:'1rem',color:'#facc15'}}>Overview</h2>
    <div style={{display:'grid',gridTemplateColumns:'repeat(3,1fr)',gap:8,marginBottom:'1rem'}}>
      <div className="metric"><div style={{fontSize:10,color:'#666',marginBottom:4}}>Pending</div><div style={{fontSize:20,fontWeight:700,color:'#facc15'}}>{stats.pending}</div></div>
      <div className="metric"><div style={{fontSize:10,color:'#666',marginBottom:4}}>Approved</div><div style={{fontSize:20,fontWeight:700,color:'#22c55e'}}>{stats.approved}</div></div>
      <div className="metric"><div style={{fontSize:10,color:'#666',marginBottom:4}}>Rejected</div><div style={{fontSize:20,fontWeight:700,color:'#ef4444'}}>{stats.rejected}</div></div>
    </div>
    {stats.commands > 0 && <div className="metric" style={{marginBottom:'1rem',background:'#1c1917',border:'1px solid #facc1530'}}><span style={{fontSize:12,color:'#facc15'}}>{stats.commands} pending command(s)</span></div>}
    <h3 style={{fontSize:14,fontWeight:600,marginBottom:'.75rem'}}>Recent Runs</h3>
    {runs.length === 0 ? <div className="card empty"><p>No runs yet. WW-B will push findings here.</p></div> :
      runs.map(r => <div key={r.id} className="card" onClick={() => go('runs',r.id)} style={{cursor:'pointer'}}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
          <span style={{fontSize:14,fontWeight:600}}>Run #{r.run_number}</span>
          <span className="badge" style={{background:r.status==='completed'?'#052e16':'#1c1917',color:r.status==='completed'?'#22c55e':'#facc15'}}>{r.status}</span>
        </div>
        <div style={{fontSize:11,color:'#666',marginBottom:4}}>{r.mode} · {new Date(r.created_at).toLocaleDateString()}</div>
        <div style={{display:'flex',gap:10,fontSize:11}}>
          <span style={{color:'#facc15'}}>{r.pending_count} pending</span>
          <span style={{color:'#22c55e'}}>{r.approved_count}✓</span>
          <span style={{color:'#ef4444'}}>{r.rejected_count}✗</span>
        </div>
      </div>)
    }
  </>;
}

// ═══ REVIEW ═════════════════════════════════════════════════════════════════
function ReviewPage() {
  const [findings, setFindings] = useState([]);
  const [sel, setSel] = useState(new Set());
  const [loaded, setLoaded] = useState(false);
  const load = () => api('/findings/pending').then(f => {setFindings(f);setLoaded(true)});
  useEffect(() => {load()}, []);

  const review = async (id, status) => { await api(`/findings/${id}/review`, {status}); setFindings(p => p.filter(f=>f.id!==id)); setSel(p=>{const n=new Set(p);n.delete(id);return n}); };
  const bulk = async (status) => { if(!sel.size) return; await api('/findings/bulk-review', {ids:[...sel],status}); setFindings(p=>p.filter(f=>!sel.has(f.id))); setSel(new Set()); };
  const toggle = id => setSel(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n});
  const selAll = () => sel.size===findings.length ? setSel(new Set()) : setSel(new Set(findings.map(f=>f.id)));

  if (!loaded) return <div className="empty"><p>Loading...</p></div>;
  if (!findings.length) return <div className="empty"><h3>All clear</h3><p>No pending findings.</p></div>;
  return <>
    <h2 style={{fontSize:16,fontWeight:600,marginBottom:'.75rem',color:'#facc15'}}>Review ({findings.length})</h2>
    {sel.size > 0 && <div style={{display:'flex',gap:8,marginBottom:'.75rem',padding:'.5rem .75rem',alignItems:'center'}} className="card">
      <span style={{fontSize:12,color:'#888',flex:1}}>{sel.size} selected</span>
      <button className="btn-sm" style={{background:'#052e16',color:'#22c55e'}} onClick={()=>bulk('approved')}>Approve all</button>
      <button className="btn-sm" style={{background:'#1c0a0a',color:'#ef4444'}} onClick={()=>bulk('rejected')}>Reject all</button>
    </div>}
    <button onClick={selAll} style={{fontSize:11,color:'#666',background:'none',border:'none',cursor:'pointer',marginBottom:8}}>{sel.size===findings.length?'Deselect all':'Select all'}</button>
    {findings.map(f => <div key={f.id} className="card" style={{borderLeft:`3px solid ${sel.has(f.id)?'#facc15':'#1e1e2a'}`,background:sel.has(f.id)?'#14141e':'#111118'}}>
      <div style={{display:'flex',alignItems:'center',gap:8,marginBottom:6}}>
        <input type="checkbox" checked={sel.has(f.id)} onChange={()=>toggle(f.id)} />
        <span className="badge" style={{background:f.severity==='critical'?'#1c0a0a':f.severity==='major'?'#1c1507':'#0a1428',color:f.severity==='critical'?'#ef4444':f.severity==='major'?'#f59e0b':'#3b82f6'}}>{f.severity}</span>
        <span style={{fontSize:11,color:'#888'}}>{f.category}</span>
        <span style={{fontSize:10,color:'#555',marginLeft:'auto'}}>{Math.round(f.confidence*100)}%</span>
      </div>
      <div style={{fontSize:13,fontWeight:500,marginBottom:4}}>{f.title}</div>
      {f.description && f.description!==f.title && <div style={{fontSize:12,color:'#888',marginBottom:6,lineHeight:1.5}}>{f.description.slice(0,200)}</div>}
      {f.file && <div style={{fontSize:11,color:'#555',marginBottom:4}}>File: {f.file}</div>}
      {f.old_value && <div className="diff-old">- {f.old_value.slice(0,150)}</div>}
      {f.new_value && <div className="diff-new">+ {f.new_value.slice(0,150)}</div>}
      <div style={{display:'flex',gap:8,marginTop:8}}>
        <button className="btn-sm" style={{background:'#052e16',color:'#22c55e'}} onClick={()=>review(f.id,'approved')}>Approve</button>
        <button className="btn-sm" style={{background:'#1c0a0a',color:'#ef4444'}} onClick={()=>review(f.id,'rejected')}>Reject</button>
      </div>
    </div>)}
  </>;
}

// ═══ APPLY ══════════════════════════════════════════════════════════════════
function ApplyPage() {
  const [findings, setFindings] = useState([]);
  const [sel, setSel] = useState(new Set());
  const [msg, setMsg] = useState('');
  const [loaded, setLoaded] = useState(false);
  useEffect(() => { api('/findings/approved').then(f=>{setFindings(f);setLoaded(true)}); }, []);

  const toggle = id => setSel(p=>{const n=new Set(p);n.has(id)?n.delete(id):n.add(id);return n});
  const selAll = () => sel.size===findings.length ? setSel(new Set()) : setSel(new Set(findings.map(f=>f.id)));
  const remove = async id => { await api(`/findings/${id}/review`,{status:'rejected',note:'Removed from apply'}); setFindings(p=>p.filter(f=>f.id!==id)); };
  const apply = async () => {
    if(!sel.size) return;
    const items = findings.filter(f=>sel.has(f.id));
    await api('/commands', {text:`APPLY:\n${items.map(f=>`- [${f.category}] ${f.title}`).join('\n')}`, type:'apply'});
    setMsg(`${sel.size} queued for WW-B`);
    setSel(new Set());
  };

  if (!loaded) return <div className="empty"><p>Loading...</p></div>;
  if (!findings.length) return <div className="empty"><h3>Nothing to apply</h3><p>Approve findings from Review tab first.</p></div>;
  return <>
    <h2 style={{fontSize:16,fontWeight:600,marginBottom:4,color:'#22c55e'}}>Apply Changes</h2>
    <p style={{fontSize:12,color:'#666',marginBottom:'1rem'}}>Select approved findings to apply.</p>
    <div style={{display:'flex',gap:8,marginBottom:'.75rem',alignItems:'center'}} className="card">
      <button onClick={selAll} style={{fontSize:12,color:'#facc15',background:'none',border:'none',cursor:'pointer'}}>{sel.size===findings.length?'Deselect':'Select all'}</button>
      <div style={{flex:1}}/>
      {sel.size > 0 && <button className="btn btn-green" onClick={apply}>Apply {sel.size} selected</button>}
    </div>
    {msg && <div style={{fontSize:12,padding:'8px 12px',borderRadius:8,marginBottom:'.75rem',background:'#052e16',color:'#22c55e',border:'1px solid #22c55e40'}}>{msg}</div>}
    {findings.map(f => <div key={f.id} className="card" style={{borderLeft:`3px solid ${sel.has(f.id)?'#22c55e':'#1e1e2a'}`,background:sel.has(f.id)?'#0d1a0f':'#111118'}}>
      <div style={{display:'flex',alignItems:'flex-start',gap:10}}>
        <input type="checkbox" checked={sel.has(f.id)} onChange={()=>toggle(f.id)} style={{marginTop:2}} />
        <div style={{flex:1,minWidth:0}}>
          <div style={{fontSize:13,fontWeight:500,marginBottom:3}}>{f.title}</div>
          <div style={{fontSize:11,color:'#888',marginBottom:4}}>{f.category} · {f.severity} · {Math.round(f.confidence*100)}%{f.file && ` · ${f.file}`}</div>
          {f.old_value && <div className="diff-old">- {f.old_value.slice(0,150)}</div>}
          {f.new_value && <div className="diff-new">+ {f.new_value.slice(0,150)}</div>}
        </div>
        <button className="btn-sm" style={{color:'#ef4444',background:'#1c0a0a',flexShrink:0}} onClick={()=>remove(f.id)}>Remove</button>
      </div>
    </div>)}
  </>;
}

// ═══ COMMAND ════════════════════════════════════════════════════════════════
function CommandPage() {
  const [text, setText] = useState('');
  const [cmds, setCmds] = useState([]);
  const [sending, setSending] = useState(false);
  useEffect(() => { api('/commands').then(setCmds); }, []);

  const send = async (t) => {
    const v = t || text.trim(); if(!v) return;
    setSending(true);
    await api('/commands', {text:v,type:'instruction'});
    setText('');
    const updated = await api('/commands');
    setCmds(updated);
    setSending(false);
  };

  const quickActions = [
    ['🔍 Full audit', 'Run a full audit of the app'],
    ['🎯 Banners', 'Check if banner data needs updating'],
    ['📅 Events', 'Check if event dates need updating'],
    ['🐛 Bugs', 'Run user scenario tests to find bugs'],
    ['🔗 URLs', 'Check all image URLs for broken links'],
  ];

  return <>
    <h2 style={{fontSize:16,fontWeight:600,marginBottom:4,color:'#facc15'}}>Command WW-B</h2>
    <p style={{fontSize:12,color:'#666',marginBottom:'1rem'}}>Give instructions, share links, or tell WW-B what to do.</p>
    <div style={{display:'flex',gap:6,marginBottom:'1rem',flexWrap:'wrap'}}>
      {quickActions.map(([label,cmd]) => <button key={label} className="quick-btn" onClick={()=>send(cmd)} disabled={sending}>{label}</button>)}
    </div>
    <div className="card">
      <textarea value={text} onChange={e=>setText(e.target.value)} placeholder="Type instructions, paste a link, describe what to check..." rows={3} />
      <div style={{display:'flex',justifyContent:'flex-end',marginTop:8}}>
        <button className="btn btn-gold" disabled={!text.trim()||sending} onClick={()=>send()}>{sending?'Sending...':'Send'}</button>
      </div>
    </div>
    <h3 style={{fontSize:13,fontWeight:600,marginTop:'1.5rem',marginBottom:'.5rem',color:'#888'}}>History</h3>
    {cmds.length === 0 ? <div style={{color:'#555',fontSize:12,textAlign:'center',padding:'2rem'}}>No commands yet.</div> :
      cmds.map(c => <div key={c.id} className="card" style={{borderLeft:`3px solid ${c.status==='done'?'#22c55e':'#facc15'}`}}>
        <div style={{fontSize:13,marginBottom:4,whiteSpace:'pre-wrap',lineHeight:1.5}}>{c.text}</div>
        <div style={{fontSize:10,color:'#555'}}>{new Date(c.created_at).toLocaleString()} · <span style={{color:c.status==='done'?'#22c55e':'#facc15'}}>{c.status}</span></div>
        {c.result && <div style={{fontSize:11,color:'#888',marginTop:6,background:'#0a0a0f',padding:'6px 8px',borderRadius:6,whiteSpace:'pre-wrap'}}>{c.result}</div>}
      </div>)
    }
  </>;
}

// ═══ RUNS ═══════════════════════════════════════════════════════════════════
function RunsPage({runId, onBack}) {
  const [runs, setRuns] = useState([]);
  const [detail, setDetail] = useState(null);
  useEffect(() => { api('/runs?limit=50').then(setRuns); }, []);
  useEffect(() => { if(runId) api(`/runs/${runId}`).then(setDetail); }, [runId]);

  if (detail) return <>
    <button onClick={()=>{setDetail(null);onBack?.()}} style={{fontSize:12,color:'#facc15',background:'none',border:'none',cursor:'pointer',marginBottom:'1rem'}}>← Back</button>
    <h2 style={{fontSize:16,fontWeight:600,marginBottom:4}}>Run #{detail.run_number}</h2>
    <div style={{fontSize:12,color:'#666',marginBottom:'1rem'}}>{detail.mode} · {new Date(detail.created_at).toLocaleString()}</div>
    <h3 style={{fontSize:14,fontWeight:600,marginBottom:'.75rem'}}>Findings ({detail.findings?.length||0})</h3>
    {(detail.findings||[]).map(f => <div key={f.id} className="card" style={{borderLeft:`3px solid ${f.severity==='critical'?'#ef4444':f.severity==='major'?'#f59e0b':'#3b82f6'}`}}>
      <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
        <span style={{fontSize:13,fontWeight:500}}>{f.title}</span>
        <span className="badge" style={{background:f.status==='approved'?'#052e16':f.status==='rejected'?'#1c0a0a':'#1c1917',color:f.status==='approved'?'#22c55e':f.status==='rejected'?'#ef4444':'#facc15'}}>{f.status}</span>
      </div>
      <div style={{fontSize:11,color:'#555'}}>{f.category} · {f.severity} · {Math.round(f.confidence*100)}%</div>
    </div>)}
    {detail.actions?.length > 0 && <>
      <h3 style={{fontSize:14,fontWeight:600,marginBottom:'.75rem',marginTop:'1rem'}}>Log ({detail.actions.length})</h3>
      <div className="card" style={{maxHeight:300,overflowY:'auto'}}>
        {detail.actions.map(a => <div key={a.id} style={{marginBottom:8,paddingBottom:8,borderBottom:'1px solid #1e1e2a'}}>
          <div style={{fontSize:10,color:'#555'}}>{new Date(a.created_at).toLocaleTimeString()} · <span style={{color:'#facc15'}}>{a.category}</span></div>
          <div style={{fontSize:12,color:'#ccc'}}>{a.description}</div>
        </div>)}
      </div>
    </>}
  </>;

  return <>
    <h2 style={{fontSize:16,fontWeight:600,marginBottom:'1rem',color:'#facc15'}}>All Runs</h2>
    {runs.length===0 ? <div className="empty"><p>No runs yet.</p></div> :
      runs.map(r => <div key={r.id} className="card" style={{cursor:'pointer'}} onClick={()=>api(`/runs/${r.id}`).then(setDetail)}>
        <div style={{display:'flex',justifyContent:'space-between',marginBottom:4}}>
          <span style={{fontSize:14,fontWeight:600}}>#{r.run_number}</span>
          <span className="badge" style={{background:r.status==='completed'?'#052e16':'#1c1917',color:r.status==='completed'?'#22c55e':'#facc15'}}>{r.status}</span>
        </div>
        <div style={{fontSize:11,color:'#666',marginBottom:4}}>{r.mode} · {new Date(r.created_at).toLocaleDateString()}</div>
        <div style={{display:'flex',gap:10,fontSize:11}}>
          <span>{r.finding_count} findings</span>
          <span style={{color:'#22c55e'}}>{r.approved_count}✓</span>
          <span style={{color:'#ef4444'}}>{r.rejected_count}✗</span>
          <span style={{color:'#facc15'}}>{r.pending_count} pending</span>
        </div>
      </div>)
    }
  </>;
}

// ═══ APP ════════════════════════════════════════════════════════════════════
function App() {
  const [tab, setTab] = useState(0);
  const [runId, setRunId] = useState(null);
  const tabs = ['Home','Review','Apply','Command','Runs'];
  const go = (name, id) => { setTab(tabs.indexOf(name.charAt(0).toUpperCase()+name.slice(1))); if(id) setRunId(id); };
  return <>
    <header>
      <div className="logo">WW-B</div>
      <nav>{tabs.map((t,i) => <button key={t} className={tab===i?'active':''} onClick={()=>{setTab(i);setRunId(null)}}>{t}</button>)}</nav>
    </header>
    <main>
      {tab===0 && <HomePage go={go} />}
      {tab===1 && <ReviewPage />}
      {tab===2 && <ApplyPage />}
      {tab===3 && <CommandPage />}
      {tab===4 && <RunsPage runId={runId} onBack={()=>setRunId(null)} />}
    </main>
  </>;
}

ReactDOM.createRoot(document.getElementById('root')).render(React.createElement(App));
</script>
</body>
</html>
