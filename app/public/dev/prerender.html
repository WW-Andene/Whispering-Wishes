<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spine Pre-render</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0a0a12; color: #cbd5e1; padding: 12px; }
    header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid #1e293b; }
    header label { display: flex; align-items: center; gap: 4px; font-size: 13px; }
    header input[type="number"] { width: 70px; background: #0f172a; color: #cbd5e1; border: 1px solid #334155; border-radius: 4px; padding: 4px 6px; }
    button { background: #3b82f6; color: white; border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
    button:disabled { background: #475569; cursor: not-allowed; }
    button.danger { background: #b91c1c; }
    main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding-top: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 4px 8px; text-align: left; border-bottom: 1px solid #1e293b; }
    th { background: #0f172a; font-weight: 600; color: #94a3b8; }
    td.status-ok { color: #4ade80; }
    td.status-skip { color: #94a3b8; }
    td.status-err { color: #f87171; }
    td.status-busy { color: #facc15; }
    td.seam-good { color: #4ade80; }
    td.seam-warn { color: #facc15; }
    td.seam-bad { color: #f87171; }
    .preview { background: #0f172a; border: 1px solid #1e293b; border-radius: 6px; padding: 8px; }
    .preview canvas { width: 100%; aspect-ratio: 1; background: repeating-conic-gradient(#1e293b 0% 25%, #0f172a 0% 50%) 0 0/16px 16px; image-rendering: pixelated; }
    .log { font-family: ui-monospace, monospace; font-size: 11px; color: #94a3b8; max-height: 200px; overflow-y: auto; padding: 6px; background: #020617; border-radius: 4px; margin-top: 8px; white-space: pre-wrap; }
  </style>
</head>
<body>
  <header>
    <h1 style="font-size: 16px; color: #f1f5f9;">Spine Pre-render</h1>
    <label>Resolution <input type="number" id="resolution" value="1024" min="256" max="2048" step="128"></label>
    <label>Bitrate (Mbps) <input type="number" id="bitrate" value="5" min="1" max="20" step="1"></label>
    <label>Animation <input type="text" id="animName" value="idle" size="8"></label>
    <button id="probe" title="Mount the first sprite once and dump player API keys to the log. Run this first if Capture errors out.">Probe API</button>
    <button id="capture">Capture all</button>
    <button id="captureOne">Capture selected</button>
    <button id="downloadZip" disabled>Download ZIP</button>
    <span id="counter" style="margin-left: auto; font-size: 12px; color: #94a3b8;">0 / 0</span>
  </header>

  <main>
    <div>
      <table>
        <thead>
          <tr><th>#</th><th>Char</th><th>Anim</th><th>Duration</th><th>Size</th><th>α</th><th>Status</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="preview">
      <div style="font-size: 13px; color: #f1f5f9; margin-bottom: 6px;">Live preview</div>
      <canvas id="preview" width="512" height="512"></canvas>
      <div class="log" id="log"></div>
    </div>
  </main>

  <!-- Spine 4.1 runtime (matches what the app uses for sprite portraits). -->
  <script src="https://unpkg.com/@esotericsoftware/spine-player@4.1.55/dist/iife/spine-player.js"></script>
  <!-- Capture as 4.1 namespace and clear window.spine so we don't shadow anything later. -->
  <script>
    window.spine41 = window.spine;
    window.spine = undefined;
  </script>
  <!-- fflate for browser-side ZIPing without bundlers. -->
  <script src="https://unpkg.com/fflate@0.8.2/umd/index.js"></script>

  <script>
    'use strict';

    const $ = (id) => document.getElementById(id);
    const log = (msg) => {
      const el = $('log');
      el.textContent += msg + '\n';
      el.scrollTop = el.scrollHeight;
    };

    let spriteList = [];
    let zipBuffer = null;
    let busy = false;

    async function init() {
      spriteList = await fetch('./sprite-list.json').then(r => r.json());
      const tbody = $('rows');
      spriteList.forEach((entry, i) => {
        const tr = document.createElement('tr');
        tr.dataset.idx = i;
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td>${entry.name} <span style="color:#64748b;font-size:11px;">(${entry.key})</span></td>
          <td class="anim">—</td>
          <td class="duration">—</td>
          <td class="frames">—</td>
          <td class="seam">—</td>
          <td class="status status-skip">pending</td>
        `;
        tr.style.cursor = 'pointer';
        tr.addEventListener('click', () => {
          document.querySelectorAll('#rows tr').forEach((r) => (r.style.background = ''));
          tr.style.background = '#1e293b';
          tr.dataset.selected = '1';
          document.querySelectorAll('#rows tr').forEach((r) => { if (r !== tr) delete r.dataset.selected; });
        });
        tbody.appendChild(tr);
      });
      $('counter').textContent = `0 / ${spriteList.length}`;
      log(`Loaded ${spriteList.length} sprite entries.`);
    }

    function setRowStatus(idx, cls, text) {
      const tr = document.querySelector(`#rows tr[data-idx="${idx}"]`);
      if (!tr) return;
      const td = tr.querySelector('.status');
      td.className = `status ${cls}`;
      td.textContent = text;
    }
    function setRowField(idx, field, value, cls) {
      const tr = document.querySelector(`#rows tr[data-idx="${idx}"]`);
      if (!tr) return;
      const td = tr.querySelector(`.${field}`);
      if (cls) td.className = `${field} ${cls}`;
      td.textContent = value;
    }

    // ────────────────────────────────────────────────────────────────────────
    // Spine asset loading + frame capture
    //
    // Uses spine-player's high-level widget (the same class the rest of the
    // app uses) — the lower-level WebGL classes aren't on the IIFE global,
    // they live in a separate spine-webgl bundle we don't load. We let the
    // widget play the animation naturally and snapshot its canvas every
    // requestAnimationFrame for `duration` seconds. Frame interval matches
    // the display's refresh rate (typically 60 Hz).
    // ────────────────────────────────────────────────────────────────────────

    function canvasToPng(canvas) {
      return new Promise((res, rej) => canvas.toBlob(
        (b) => b ? res(b) : rej(new Error('toBlob null')),
        'image/png',
      ));
    }

    async function pixelsFromBlob(blob) {
      const img = await createImageBitmap(blob);
      const c = new OffscreenCanvas(img.width, img.height);
      const ctx = c.getContext('2d');
      ctx.drawImage(img, 0, 0);
      return ctx.getImageData(0, 0, img.width, img.height).data;
    }

    async function pixelDelta(blobA, blobB) {
      const [a, b] = await Promise.all([pixelsFromBlob(blobA), pixelsFromBlob(blobB)]);
      let sum = 0;
      const n = a.length;
      for (let i = 0; i < n; i++) sum += Math.abs(a[i] - b[i]);
      return sum / n; // mean abs delta per channel byte (0..255)
    }

    // Capture flow:
    // - Mount spine-player so it plays the animation naturally on its own
    //   rAF loop (fixes the "all frames identical" bug from the old loop —
    //   when we set state.timeScale=0, spine-player short-circuits its
    //   draw call entirely, so only frame 0 ever ended up on the canvas).
    // - Tap canvas.captureStream() into a MediaRecorder.
    // - Record for exactly `animation.duration` seconds, starting from
    //   trackTime=0, which gives us one full cycle by definition.
    // - Output one WebM file per character (~2-5 MB at 1024² VP9 alpha,
    //   compared to ~500 KB × 240 PNG frames = 120 MB the old way).

    function pickWebmMime() {
      const candidates = [
        'video/webm;codecs=vp9',  // alpha-capable on Chrome
        'video/webm;codecs=vp8',  // no alpha
        'video/webm',
      ];
      for (const t of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
      }
      return null;
    }

    function recordCanvas(canvas, durationMs, mimeType, bitrate) {
      return new Promise((resolve, reject) => {
        const stream = canvas.captureStream(60);
        let recorder;
        try {
          recorder = new MediaRecorder(stream, {
            mimeType,
            videoBitsPerSecond: bitrate,
          });
        } catch (err) {
          reject(err);
          return;
        }
        const chunks = [];
        recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        recorder.onerror = (e) => reject(e.error || new Error('MediaRecorder error'));
        recorder.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          resolve(new Blob(chunks, { type: mimeType }));
        };
        recorder.start();
        setTimeout(() => {
          if (recorder.state !== 'inactive') recorder.stop();
        }, durationMs);
      });
    }

    async function captureChar(idx, entry, opts) {
      setRowStatus(idx, 'status-busy', 'mounting');

      const mimeType = pickWebmMime();
      if (!mimeType) {
        throw new Error('MediaRecorder + WebM not supported in this browser');
      }
      const isAlphaCapable = mimeType.includes('vp9');

      const host = document.createElement('div');
      host.style.cssText = `position:fixed;left:-9999px;top:0;width:${opts.resolution}px;height:${opts.resolution}px;`;
      document.body.appendChild(host);

      if (!window.spine41 || !window.spine41.SpinePlayer) {
        host.remove();
        throw new Error('window.spine41.SpinePlayer not available — check the script tag');
      }

      let player;
      try {
        player = await new Promise((resolve, reject) => {
          let resolved = false;
          const inst = new window.spine41.SpinePlayer(host, {
            skelUrl: entry.skelUrl,
            atlasUrl: entry.atlasUrl,
            animation: opts.animName,
            // loop=true so the recording wraps cleanly if our setTimeout
            // overshoots by a frame or two — the recorder stops on its
            // own deadline regardless.
            loop: true,
            backgroundColor: '#00000000',
            alpha: true,
            premultipliedAlpha: false,
            preserveDrawingBuffer: true,
            showControls: false,
            showLoading: false,
            success: () => { resolved = true; resolve(inst); },
            error: (p, msg) => { if (!resolved) reject(new Error(msg || 'spine-player error')); },
          });
          setTimeout(() => { if (!resolved) reject(new Error('mount timeout')); }, 30000);
        });
      } catch (err) {
        host.remove();
        throw err;
      }

      const canvas = player.canvas;
      const skel = player.skeleton;
      const state = player.animationState;
      const animation = skel.data.findAnimation(opts.animName) || skel.data.animations[0];
      if (!animation) {
        try { player.dispose(); } catch {}
        host.remove();
        throw new Error('no animation');
      }
      setRowField(idx, 'anim', animation.name);
      setRowField(idx, 'duration', animation.duration.toFixed(3) + 's');

      // Reset to t=0 right before recording so the first captured video
      // frame matches the start of the cycle.
      state.clearTracks();
      const track = state.setAnimation(0, animation.name, true);
      if (track) track.trackTime = 0;
      state.apply(skel);
      skel.updateWorldTransform();
      // Let the player render the t=0 pose before we tap the stream.
      await new Promise((res) => requestAnimationFrame(res));
      await new Promise((res) => requestAnimationFrame(res));

      const previewCtx = $('preview').getContext('2d');
      // Mirror the canvas onto the live preview at ~30Hz while recording.
      let mirroring = true;
      const mirror = () => {
        if (!mirroring) return;
        previewCtx.clearRect(0, 0, 512, 512);
        previewCtx.drawImage(canvas, 0, 0, 512, 512);
        requestAnimationFrame(mirror);
      };
      mirror();

      const start = performance.now();
      setRowStatus(idx, 'status-busy', 'recording…');

      const durationMs = animation.duration * 1000;
      // VP9 at ~5 Mbps gives visually-lossless quality at 1024² — that's
      // the same target bitrate YouTube uses for HD spine-style content.
      // Increase via Bitrate input (default 5 Mbps).
      const bitrate = opts.bitrate * 1_000_000;
      const blob = await recordCanvas(canvas, durationMs, mimeType, bitrate);

      mirroring = false;
      try { player.dispose(); } catch {}
      host.remove();

      const wallSec = (performance.now() - start) / 1000;
      setRowField(idx, 'frames', `${(blob.size / 1024).toFixed(0)} KB`);
      setRowField(idx, 'seam', isAlphaCapable ? 'α' : 'no α', isAlphaCapable ? 'seam-good' : 'seam-warn');
      setRowStatus(idx, 'status-ok', `webm ${(blob.size / 1024 / 1024).toFixed(2)} MB in ${wallSec.toFixed(1)}s`);

      return {
        entry,
        blob,
        mimeType,
        duration: animation.duration,
        animName: animation.name,
        alphaCapable: isAlphaCapable,
      };
    }

    async function packZip(results, opts) {
      log(`Packing ZIP for ${results.length} characters…`);
      const files = {};
      for (const r of results) {
        const name = `${r.entry.dir}/Portraits_${r.entry.portrait}_idle.webm`;
        const buf = new Uint8Array(await r.blob.arrayBuffer());
        files[name] = buf;
      }
      const manifest = {
        format: 'webm',
        codec: 'vp9',
        captured: results.map((r) => ({
          key: r.entry.key,
          name: r.entry.name,
          dir: r.entry.dir,
          portrait: r.entry.portrait,
          file: `${r.entry.dir}/Portraits_${r.entry.portrait}_idle.webm`,
          duration: r.duration,
          animName: r.animName,
          mimeType: r.mimeType,
          alphaCapable: r.alphaCapable,
          sizeBytes: r.blob.size,
        })),
      };
      files['manifest.json'] = new TextEncoder().encode(JSON.stringify(manifest, null, 2));
      // WebM is already compressed; level 0 (store) keeps zip fast.
      const zipped = fflate.zipSync(files, { level: 0 });
      const blob = new Blob([zipped], { type: 'application/zip' });
      zipBuffer = blob;
      $('downloadZip').disabled = false;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'spine-prerender.zip';
      a.click();
      log(`ZIP ready (${(blob.size / 1024 / 1024).toFixed(1)} MB).`);
    }

    function readOpts() {
      return {
        resolution: parseInt($('resolution').value, 10) || 1024,
        bitrate: parseInt($('bitrate').value, 10) || 5,
        animName: ($('animName').value || 'idle').trim(),
      };
    }

    // Diagnostic: mount the first sprite, wait for success, dump everything
    // we expect captureChar to use. If a property is missing, the log shows
    // exactly what's actually on the player object so we can adapt.
    async function probeApi() {
      log('--- API probe ---');
      log('window.spine41: ' + (window.spine41 ? 'present' : 'missing'));
      if (window.spine41) {
        log('window.spine41 keys: ' + Object.keys(window.spine41).join(', '));
        log('window.spine41.SpinePlayer: ' + (window.spine41.SpinePlayer ? 'present' : 'missing'));
      }
      if (!spriteList.length) { log('no sprite-list.json loaded'); return; }
      const entry = spriteList[0];
      log(`probing first entry: ${entry.key} (${entry.skelUrl})`);

      const host = document.createElement('div');
      host.style.cssText = 'position:fixed;left:-9999px;top:0;width:512px;height:512px;';
      document.body.appendChild(host);

      try {
        const player = await new Promise((resolve, reject) => {
          let done = false;
          const inst = new window.spine41.SpinePlayer(host, {
            skelUrl: entry.skelUrl,
            atlasUrl: entry.atlasUrl,
            animation: 'idle',
            loop: false,
            backgroundColor: '#00000000',
            alpha: true,
            premultipliedAlpha: false,
            preserveDrawingBuffer: true,
            showControls: false,
            showLoading: false,
            success: () => { done = true; resolve(inst); },
            error: (p, msg) => { if (!done) reject(new Error(msg || 'spine-player error')); },
          });
          setTimeout(() => { if (!done) reject(new Error('mount timeout (10s)')); }, 10000);
        });
        log('mount: success');
        log('player keys: ' + Object.keys(player).join(', '));
        log('player.canvas: ' + (player.canvas ? `<canvas ${player.canvas.width}x${player.canvas.height}>` : 'missing'));
        log('player.skeleton: ' + (player.skeleton ? 'present' : 'missing'));
        log('player.animationState: ' + (player.animationState ? 'present' : 'missing'));
        log('player.sceneRenderer: ' + (player.sceneRenderer ? 'present' : 'missing'));
        log('player.assetManager: ' + (player.assetManager ? 'present' : 'missing'));
        if (player.skeleton?.data) {
          const anims = (player.skeleton.data.animations || []).map((a) => `${a.name}(${a.duration.toFixed(2)}s)`);
          log('skeleton.data.animations: [' + anims.join(', ') + ']');
        }
        if (player.animationState) {
          log('animationState methods: ' + Object.keys(player.animationState).join(', '));
        }
        try { player.dispose(); } catch (e) { log('dispose threw: ' + e.message); }
      } catch (err) {
        log('probe FAILED: ' + (err.message || err));
        if (err.stack) log(err.stack);
      } finally {
        host.remove();
      }
      log('--- end probe ---');
    }

    async function captureMany(indices) {
      if (busy) return;
      busy = true;
      $('capture').disabled = true;
      $('captureOne').disabled = true;
      const opts = readOpts();
      const results = [];
      let done = 0;
      $('counter').textContent = `0 / ${indices.length}`;
      for (const idx of indices) {
        try {
          const r = await captureChar(idx, spriteList[idx], opts);
          results.push(r);
        } catch (err) {
          console.error(err);
          setRowStatus(idx, 'status-err', String(err.message || err).slice(0, 40));
          log(`✗ ${spriteList[idx].key}: ${err.message || err}`);
        }
        done++;
        $('counter').textContent = `${done} / ${indices.length}`;
      }
      if (results.length) await packZip(results, opts);
      busy = false;
      $('capture').disabled = false;
      $('captureOne').disabled = false;
    }

    $('probe').addEventListener('click', () => { probeApi().catch((e) => log('probe error: ' + e)); });
    $('capture').addEventListener('click', () => {
      const indices = spriteList.map((_, i) => i);
      captureMany(indices);
    });
    $('captureOne').addEventListener('click', () => {
      const sel = document.querySelector('#rows tr[data-selected="1"]');
      if (!sel) {
        alert('Click a row first.');
        return;
      }
      captureMany([parseInt(sel.dataset.idx, 10)]);
    });
    $('downloadZip').addEventListener('click', () => {
      if (!zipBuffer) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(zipBuffer);
      a.download = 'spine-prerender.zip';
      a.click();
    });

    init().catch((e) => {
      log('init error: ' + (e.message || e));
    });
  </script>
</body>
</html>
