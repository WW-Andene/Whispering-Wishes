<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Spine Pre-render</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; background: #0a0a12; color: #cbd5e1; padding: 12px; }
    header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap; padding-bottom: 12px; border-bottom: 1px solid #1e293b; }
    header label { display: flex; align-items: center; gap: 4px; font-size: 13px; }
    header input[type="number"], header input[type="text"], header select {
      background: #0f172a; color: #cbd5e1; border: 1px solid #334155; border-radius: 4px; padding: 4px 6px;
    }
    header input[type="number"] { width: 70px; }
    header select { padding: 4px 8px; }
    button { background: #3b82f6; color: white; border: none; border-radius: 6px; padding: 6px 14px; font-size: 13px; cursor: pointer; }
    button:disabled { background: #475569; cursor: not-allowed; }
    button.danger { background: #b91c1c; }
    button.success { background: #15803d; }
    main { display: grid; grid-template-columns: 1fr 320px; gap: 16px; padding-top: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 12px; }
    th, td { padding: 4px 8px; text-align: left; border-bottom: 1px solid #1e293b; }
    th { background: #0f172a; font-weight: 600; color: #94a3b8; }
    td.status-ok { color: #4ade80; }
    td.status-skip { color: #94a3b8; }
    td.status-err { color: #f87171; }
    td.status-busy { color: #facc15; }
    td.seam-good { color: #4ade80; }
    td.seam-warn { color: #facc15; }
    td.seam-bad { color: #f87171; }
    .badge { display: inline-block; padding: 1px 6px; border-radius: 3px; font-size: 10px; font-weight: 600; vertical-align: middle; }
    .badge.sprite { background: #1e3a8a; color: #bfdbfe; }
    .badge.banner { background: #5b21b6; color: #ddd6fe; }
    .preview { background: #0f172a; border: 1px solid #1e293b; border-radius: 6px; padding: 8px; }
    .preview canvas { width: 100%; aspect-ratio: 1; background: repeating-conic-gradient(#1e293b 0% 25%, #0f172a 0% 50%) 0 0/16px 16px; image-rendering: pixelated; }
    .log { font-family: ui-monospace, monospace; font-size: 11px; color: #94a3b8; max-height: 200px; overflow-y: auto; padding: 6px; background: #020617; border-radius: 4px; margin-top: 8px; white-space: pre-wrap; }
    .group { display: flex; gap: 4px; align-items: center; padding: 2px 8px; border-left: 1px solid #1e293b; }
    .hint { font-size: 11px; color: #64748b; }
  </style>
</head>
<body>
  <header>
    <h1 style="font-size: 16px; color: #f1f5f9;">Spine Pre-render</h1>

    <div class="group">
      <label>Format
        <select id="format">
          <option value="webm">WebM (alpha)</option>
          <option value="mp4">MP4 (no alpha)</option>
        </select>
      </label>
      <label>Bitrate (Mbps) <input type="number" id="bitrate" value="5" min="1" max="40" step="1"></label>
    </div>

    <div class="group">
      <label>Native (px) <input type="number" id="nativeRes" value="512" min="128" max="2048" step="64" title="Base resolution that the multiplier scales from."></label>
      <label>Resolution
        <select id="resMul" title="Multiplier applied to the native size.">
          <option value="0.5">×0.5</option>
          <option value="1" selected>Native</option>
          <option value="2">×2</option>
          <option value="4">×4</option>
        </select>
      </label>
      <span class="hint" id="resReadout">→ 512 px</span>
    </div>

    <div class="group">
      <label>Animation <input type="text" id="animName" value="idle" size="8"></label>
      <span class="hint">duration = native cycle (animation.duration)</span>
    </div>

    <div class="group">
      <label>Background
        <select id="bgMode" title="Solid backgrounds eliminate the white-fringe artifact VP9 alpha can produce on partly-transparent pixels. MP4 always forces an opaque background.">
          <option value="transparent">Transparent (alpha)</option>
          <option value="black">Black</option>
          <option value="white">White</option>
          <option value="custom">Custom…</option>
        </select>
      </label>
      <input type="color" id="bgColor" value="#000000" title="Used when Background = Custom.">
    </div>

    <div class="group">
      <label>Filter
        <select id="surfaceFilter">
          <option value="all">all</option>
          <option value="sprite">sprite only</option>
          <option value="banner">banner only</option>
        </select>
      </label>
    </div>

    <button id="probe" title="Mount the first entry once and dump player API keys to the log. Run this first if Capture errors out.">Probe API</button>
    <button id="capture">Capture all</button>
    <button id="captureOne">Capture selected</button>
    <button id="downloadZip" disabled>Download ZIP</button>
    <button id="sendRepo" class="success" disabled title="Saves captures into the repo (writes to app/public/<outDir>/<outBase>.<ext>). Requires `vite dev` running locally.">Send to repo</button>
    <span id="counter" style="margin-left: auto; font-size: 12px; color: #94a3b8;">0 / 0</span>
  </header>

  <main>
    <div>
      <table>
        <thead>
          <tr><th>#</th><th>Char</th><th>Anim</th><th>Duration</th><th>Size</th><th>α</th><th>Status</th></tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div class="preview">
      <div style="font-size: 13px; color: #f1f5f9; margin-bottom: 6px;">Live preview</div>
      <canvas id="preview" width="512" height="512"></canvas>
      <div class="log" id="log"></div>
    </div>
  </main>

  <!-- Spine 4.2 runtime (banner JSONs). Captured to __spine42 first so the
       4.1 script below doesn't shadow it permanently. -->
  <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.109/dist/iife/spine-player.js"></script>
  <script>window.__spine42 = window.spine; window.spine = undefined;</script>
  <!-- Spine 4.1 runtime (sprite .skel binaries). Captured as window.spine41,
       then 4.2 is restored to window.spine to mirror the main app. -->
  <script src="https://unpkg.com/@esotericsoftware/spine-player@4.1.55/dist/iife/spine-player.js"></script>
  <script>
    window.spine41 = window.spine;
    window.spine = window.__spine42;
    window.spine42 = window.__spine42;
    delete window.__spine42;
  </script>
  <!-- fflate for browser-side ZIPing without bundlers. -->
  <script src="https://unpkg.com/fflate@0.8.2/umd/index.js"></script>

  <script>
    'use strict';

    const $ = (id) => document.getElementById(id);
    const log = (msg) => {
      const el = $('log');
      el.textContent += msg + '\n';
      el.scrollTop = el.scrollHeight;
    };

    let spriteList = [];
    let zipBuffer = null;
    let lastResults = []; // raw per-entry capture results, used by "Send to repo"
    let busy = false;

    async function init() {
      // Absolute path so the fetch works whether the page was opened at
      // /dev or /dev/ — the relative form would resolve to the site root
      // when there's no trailing slash, fall through to the SPA's
      // index.html, and trip a JSON.parse "Unexpected token <" error.
      spriteList = await fetch('/dev/sprite-list.json').then(r => r.json());
      renderRows();
      $('counter').textContent = `0 / ${spriteList.length}`;
      const counts = spriteList.reduce((m, e) => { m[e.surface] = (m[e.surface] || 0) + 1; return m; }, {});
      log(`Loaded ${spriteList.length} entries (${counts.sprite || 0} sprite, ${counts.banner || 0} banner).`);
      // Probe both save endpoints. Local Vite middleware wins when reachable
      // (no auth, faster); otherwise fall back to the Vercel/GitHub-API route.
      await detectSaveMode();
      updateResReadout();
    }

    // Save-mode auto-detection. Two modes are supported:
    //   'local'  — /api/dev-prerender-save (Vite middleware, writes to disk)
    //   'github' — /api/dev-prerender-upload (Vercel route, commits via API)
    // saveInfo carries mode-specific config (root for local; repo/branch for github).
    let saveMode = null;
    let saveInfo = null;

    async function detectSaveMode() {
      $('sendRepo').disabled = true;
      try {
        const r = await fetch('/api/dev-prerender-save', { method: 'GET' });
        if (r.ok) {
          saveInfo = await r.json();
          saveMode = 'local';
          $('sendRepo').disabled = false;
          $('sendRepo').title = `Local Vite endpoint — writes to app/${saveInfo.root || 'public'}/`;
          log(`Save mode: LOCAL (vite dev). Files write to app/${saveInfo.root || 'public'}/.`);
          return;
        }
      } catch {}
      try {
        const r = await fetch('/api/dev-prerender-upload', { method: 'GET' });
        if (r.ok) {
          const info = await r.json();
          saveInfo = info;
          if (info.ok) {
            saveMode = 'github';
            $('sendRepo').disabled = false;
            $('sendRepo').title = `Vercel/GitHub mode — commits to ${info.repo}@${info.branch}`;
            log(`Save mode: GITHUB. Commits to ${info.repo}@${info.branch}.`);
            return;
          }
          log(`/api/dev-prerender-upload reachable but not configured. Missing env vars: ${(info.missing || []).join(', ')}`);
        }
      } catch {}
      saveMode = null;
      log('No save endpoint reachable — "Send to repo" disabled.');
    }

    function renderRows() {
      const tbody = $('rows');
      tbody.innerHTML = '';
      const filter = $('surfaceFilter').value;
      spriteList.forEach((entry, i) => {
        if (filter !== 'all' && entry.surface !== filter) return;
        const tr = document.createElement('tr');
        tr.dataset.idx = i;
        const badge = `<span class="badge ${entry.surface}">${entry.surface}</span>`;
        tr.innerHTML = `
          <td>${i + 1}</td>
          <td>${badge} ${entry.name} <span style="color:#64748b;font-size:11px;">(${entry.key})</span></td>
          <td class="anim">—</td>
          <td class="duration">—</td>
          <td class="frames">—</td>
          <td class="seam">—</td>
          <td class="status status-skip">pending</td>
        `;
        tr.style.cursor = 'pointer';
        tr.addEventListener('click', () => {
          document.querySelectorAll('#rows tr').forEach((r) => (r.style.background = ''));
          tr.style.background = '#1e293b';
          tr.dataset.selected = '1';
          document.querySelectorAll('#rows tr').forEach((r) => { if (r !== tr) delete r.dataset.selected; });
        });
        tbody.appendChild(tr);
      });
    }

    function setRowStatus(idx, cls, text) {
      const tr = document.querySelector(`#rows tr[data-idx="${idx}"]`);
      if (!tr) return;
      const td = tr.querySelector('.status');
      td.className = `status ${cls}`;
      td.textContent = text;
    }
    function setRowField(idx, field, value, cls) {
      const tr = document.querySelector(`#rows tr[data-idx="${idx}"]`);
      if (!tr) return;
      const td = tr.querySelector(`.${field}`);
      if (cls) td.className = `${field} ${cls}`;
      td.textContent = value;
    }

    function updateResReadout() {
      const base = parseInt($('nativeRes').value, 10) || 512;
      const mul = parseFloat($('resMul').value) || 1;
      $('resReadout').textContent = `→ ${Math.round(base * mul)} px`;
    }

    // ────────────────────────────────────────────────────────────────────────
    // Codec selection — picks the best MediaRecorder mimeType for the chosen
    // format. WebM/VP9 keeps alpha; MP4/H.264 doesn't (browser MediaRecorder
    // MP4 encoders strip alpha unconditionally as of 2026).
    // ────────────────────────────────────────────────────────────────────────
    function pickMime(format) {
      const candidates = format === 'mp4'
        ? [
            'video/mp4;codecs=avc1.42E01E',
            'video/mp4;codecs=avc1',
            'video/mp4;codecs=h264',
            'video/mp4',
          ]
        : [
            'video/webm;codecs=vp9',
            'video/webm;codecs=vp8',
            'video/webm',
          ];
      for (const t of candidates) {
        if (window.MediaRecorder && MediaRecorder.isTypeSupported(t)) return t;
      }
      return null;
    }

    function fileExtFor(mimeType) {
      if (mimeType.startsWith('video/mp4')) return 'mp4';
      return 'webm';
    }

    // Resolves the background option into a concrete fill style, or null when
    // the output should keep the spine canvas's alpha channel.
    function resolveBackground(opts, mimeType) {
      // MP4 has no alpha — picking transparent there would just record the
      // page background. Force an opaque fill so the user sees what they get.
      if (mimeType.startsWith('video/mp4') && opts.bgMode === 'transparent') {
        return '#000000';
      }
      switch (opts.bgMode) {
        case 'transparent': return null;
        case 'black':       return '#000000';
        case 'white':       return '#ffffff';
        case 'custom':      return opts.bgColor || '#000000';
        default:            return null;
      }
    }

    function recordCanvas(canvas, durationMs, mimeType, bitrate) {
      return new Promise((resolve, reject) => {
        const stream = canvas.captureStream(60);
        let recorder;
        try {
          recorder = new MediaRecorder(stream, {
            mimeType,
            videoBitsPerSecond: bitrate,
          });
        } catch (err) {
          reject(err);
          return;
        }
        const chunks = [];
        recorder.ondataavailable = (e) => { if (e.data && e.data.size > 0) chunks.push(e.data); };
        recorder.onerror = (e) => reject(e.error || new Error('MediaRecorder error'));
        recorder.onstop = () => {
          stream.getTracks().forEach((t) => t.stop());
          resolve(new Blob(chunks, { type: mimeType }));
        };
        recorder.start();
        setTimeout(() => {
          if (recorder.state !== 'inactive') recorder.stop();
        }, durationMs);
      });
    }

    function spineLibFor(entry) {
      // Sprite registry is exported from Spine 4.1, banner registry from 4.2.
      // Mirror the runtime split the main app uses (SpinePlayer.jsx).
      if (entry.runtime === '4.1') return window.spine41;
      return window.spine42 || window.spine;
    }

    function assetUrlsFor(entry) {
      if (entry.skelUrl) return { skelUrl: entry.skelUrl, atlasUrl: entry.atlasUrl };
      return { jsonUrl: entry.jsonUrl, atlasUrl: entry.atlasUrl };
    }

    async function captureChar(idx, entry, opts) {
      setRowStatus(idx, 'status-busy', 'mounting');

      const mimeType = pickMime(opts.format);
      if (!mimeType) {
        throw new Error(`MediaRecorder + ${opts.format.toUpperCase()} not supported in this browser`);
      }
      const isAlphaCapable = mimeType.includes('vp9');
      const ext = fileExtFor(mimeType);

      const resolution = Math.round(opts.nativeRes * opts.resMul);

      const host = document.createElement('div');
      host.style.cssText = `position:fixed;left:-9999px;top:0;width:${resolution}px;height:${resolution}px;`;
      document.body.appendChild(host);

      const spineLib = spineLibFor(entry);
      if (!spineLib || !spineLib.SpinePlayer) {
        host.remove();
        throw new Error(`spine runtime ${entry.runtime} (${entry.runtime === '4.1' ? 'window.spine41' : 'window.spine42'}) not available`);
      }

      let player;
      try {
        player = await new Promise((resolve, reject) => {
          let resolved = false;
          const inst = new spineLib.SpinePlayer(host, {
            ...assetUrlsFor(entry),
            animation: opts.animName,
            // loop=true so the recording wraps cleanly if our setTimeout
            // overshoots by a frame or two — the recorder stops on its
            // own deadline regardless.
            loop: true,
            backgroundColor: '#00000000',
            alpha: true,
            premultipliedAlpha: false,
            preserveDrawingBuffer: true,
            showControls: false,
            showLoading: false,
            success: () => { resolved = true; resolve(inst); },
            error: (p, msg) => { if (!resolved) reject(new Error(msg || 'spine-player error')); },
          });
          setTimeout(() => { if (!resolved) reject(new Error('mount timeout')); }, 30000);
        });
      } catch (err) {
        host.remove();
        throw err;
      }

      const canvas = player.canvas;
      const skel = player.skeleton;
      const state = player.animationState;
      const animation = skel.data.findAnimation(opts.animName) || skel.data.animations[0];
      if (!animation) {
        try { player.dispose(); } catch {}
        host.remove();
        throw new Error('no animation');
      }
      setRowField(idx, 'anim', animation.name);
      setRowField(idx, 'duration', animation.duration.toFixed(3) + 's');

      // Warmup. spine-player's success callback fires when the asset manager
      // reports all atlas pages downloaded, but WebGL only uploads each page's
      // texture on first use during render. Multi-page atlases (Zani/
      // Cantarella/Xiangli Yao have 3-4 WebP pages each, vs 1 for everyone
      // else) put attachments on later pages — and animation timelines may
      // swap to those attachments only at specific keyframes (e.g. the eye
      // blinks at t=1s). If we start recording before that keyframe fires,
      // the page texture hasn't been bound yet and the slot renders with
      // garbage / wrong-region pixels (Zani's eye, Cantarella's hair tips).
      //
      // Letting the player run for at least one full animation cycle
      // guarantees every keyframe has fired and every page texture is bound
      // before the recorder taps the canvas.
      setRowStatus(idx, 'status-busy', 'warmup');
      const warmupMs = Math.max(500, animation.duration * 1000 + 200);
      const warmupDeadline = performance.now() + warmupMs;
      while (performance.now() < warmupDeadline) {
        await new Promise((res) => requestAnimationFrame(res));
      }

      // Reset to t=0 right before recording so the first captured video frame
      // matches the start of the cycle. We always capture exactly one native
      // animation cycle (animation.duration), never an arbitrary wall-clock
      // window — that's what makes the resulting loop seamless.
      state.clearTracks();
      const track = state.setAnimation(0, animation.name, true);
      if (track) track.trackTime = 0;
      state.apply(skel);
      // Spine 4.2 added a physics simulator and made updateWorldTransform()
      // require a Physics enum arg — calling it bare throws "physics is
      // undefined" on banner skeletons. Spine 4.1 still takes no args, so
      // we feature-detect via spineLib.Physics.
      if (spineLib.Physics) {
        skel.updateWorldTransform(spineLib.Physics.update);
      } else {
        skel.updateWorldTransform();
      }
      // A few more rAFs after the t=0 reset so the player's render loop
      // commits the reset pose to the canvas before captureStream taps it.
      for (let i = 0; i < 4; i++) {
        await new Promise((res) => requestAnimationFrame(res));
      }

      // Compositor canvas — every recorded frame is re-blitted onto a 2D
      // context before MediaRecorder taps it. Two reasons:
      //   1. WebGL canvases hand the browser premultiplied RGB, but VP9 alpha
      //      assumes straight alpha when encoding. Drawing through a 2D
      //      context with `alpha: true` un-premultiplies on read so the
      //      encoded video matches what the user sees on screen — kills the
      //      white speckle/halo artifact on partly-transparent pixels.
      //   2. Lets us paint a solid background underneath, which sidesteps
      //      VP9-alpha quantization noise entirely (and is the only valid
      //      output for MP4, which has no alpha channel).
      const bgFill = resolveBackground(opts, mimeType);
      const composite = document.createElement('canvas');
      composite.width = resolution;
      composite.height = resolution;
      const cctx = composite.getContext('2d', { alpha: bgFill === null });

      const previewCtx = $('preview').getContext('2d');
      let mirroring = true;
      const blit = () => {
        if (!mirroring) return;
        if (bgFill !== null) {
          cctx.fillStyle = bgFill;
          cctx.fillRect(0, 0, resolution, resolution);
        } else {
          cctx.clearRect(0, 0, resolution, resolution);
        }
        cctx.drawImage(canvas, 0, 0, resolution, resolution);
        // Mirror to live preview at the same cadence so what you see is what
        // gets encoded.
        previewCtx.clearRect(0, 0, 512, 512);
        previewCtx.drawImage(composite, 0, 0, 512, 512);
        requestAnimationFrame(blit);
      };
      blit();
      // Let the compositor land at least one frame before the recorder taps it.
      await new Promise((res) => requestAnimationFrame(res));

      const start = performance.now();
      const bgLabel = bgFill === null ? 'transparent' : bgFill;
      setRowStatus(idx, 'status-busy', `recording @ ${resolution}px (${bgLabel})…`);

      const durationMs = animation.duration * 1000;
      const bitrate = opts.bitrate * 1_000_000;
      const blob = await recordCanvas(composite, durationMs, mimeType, bitrate);

      mirroring = false;
      try { player.dispose(); } catch {}
      host.remove();

      const wallSec = (performance.now() - start) / 1000;
      // The output keeps alpha only when (a) the codec supports it and
      // (b) the compositor isn't filling a solid background underneath.
      const alphaInOutput = isAlphaCapable && bgFill === null;
      setRowField(idx, 'frames', `${(blob.size / 1024).toFixed(0)} KB`);
      setRowField(
        idx,
        'seam',
        alphaInOutput ? 'α' : (bgFill !== null ? 'opaque' : 'no α'),
        alphaInOutput ? 'seam-good' : 'seam-warn',
      );
      setRowStatus(idx, 'status-ok', `${ext} ${(blob.size / 1024 / 1024).toFixed(2)} MB in ${wallSec.toFixed(1)}s`);

      return {
        entry,
        blob,
        mimeType,
        ext,
        resolution,
        duration: animation.duration,
        animName: animation.name,
        alphaCapable: alphaInOutput,
        background: bgFill,
      };
    }

    function manifestFor(results) {
      return {
        format: results[0]?.ext || 'webm',
        codec: results[0]?.mimeType || '',
        captured: results.map((r) => ({
          key: r.entry.key,
          surface: r.entry.surface,
          name: r.entry.name,
          dir: r.entry.dir,
          file: `${r.entry.outDir}/${r.entry.outBase}.${r.ext}`,
          duration: r.duration,
          animName: r.animName,
          mimeType: r.mimeType,
          alphaCapable: r.alphaCapable,
          background: r.background,
          resolution: r.resolution,
          sizeBytes: r.blob.size,
        })),
      };
    }

    async function packZip(results) {
      log(`Packing ZIP for ${results.length} entries…`);
      const files = {};
      for (const r of results) {
        const name = `${r.entry.outDir}/${r.entry.outBase}.${r.ext}`;
        const buf = new Uint8Array(await r.blob.arrayBuffer());
        files[name] = buf;
      }
      files['manifest.json'] = new TextEncoder().encode(JSON.stringify(manifestFor(results), null, 2));
      // WebM/MP4 are already compressed; level 0 (store) keeps zip fast.
      const zipped = fflate.zipSync(files, { level: 0 });
      const blob = new Blob([zipped], { type: 'application/zip' });
      zipBuffer = blob;
      $('downloadZip').disabled = false;
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = 'spine-prerender.zip';
      a.click();
      log(`ZIP ready (${(blob.size / 1024 / 1024).toFixed(1)} MB).`);
    }

    function blobToBase64(blob) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = () => {
          const s = String(reader.result || '');
          const i = s.indexOf(',');
          resolve(i >= 0 ? s.slice(i + 1) : s);
        };
        reader.onerror = () => reject(reader.error);
        reader.readAsDataURL(blob);
      });
    }

    async function sendToRepo(results) {
      if (!results.length) {
        alert('No captures to send. Run a capture first.');
        return;
      }
      if (saveMode === 'local')  return sendToRepoLocal(results);
      if (saveMode === 'github') return sendToRepoGithub(results);
      alert('No save endpoint reachable. Re-detect by reloading the page.');
    }

    async function sendToRepoLocal(results) {
      log(`Encoding ${results.length} files for /api/dev-prerender-save…`);
      const files = {};
      for (const r of results) {
        const name = `${r.entry.outDir}/${r.entry.outBase}.${r.ext}`;
        files[name] = await blobToBase64(r.blob);
      }
      log('Posting to /api/dev-prerender-save…');
      let resp;
      try {
        resp = await fetch('/api/dev-prerender-save', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ files }),
        });
      } catch (err) {
        log(`Send failed: ${err.message || err}`);
        alert(`Send failed: ${err.message || err}`);
        return;
      }
      if (!resp.ok) {
        const text = await resp.text();
        log(`Send failed (${resp.status}): ${text}`);
        alert(`Send failed (${resp.status}): ${text}`);
        return;
      }
      const data = await resp.json();
      log(`Wrote ${data.written.length} files under app/${data.root || 'public'}/`);
      for (const w of data.written) log(`  ✓ ${w.path} (${(w.bytes / 1024).toFixed(0)} KB)`);
      for (const s of data.skipped) log(`  ✗ ${s.path}: ${s.reason}`);
      alert(`Wrote ${data.written.length} files into the repo. Run \`npm run manifest\` to refresh the runtime manifest.`);
    }

    // Vercel/GitHub-API path. Uploads each capture as a blob (one POST per
    // file to stay under the 4.5 MB body cap), accumulates SHAs, then fires
    // a single POST that turns them into one commit on the target branch.
    async function sendToRepoGithub(results) {
      let token = localStorage.getItem('prerenderAdminToken') || '';
      if (!token) {
        token = window.prompt('Enter PRERENDER_ADMIN_TOKEN (server-set secret).\nStored in localStorage on this device only.');
        if (!token) return;
        localStorage.setItem('prerenderAdminToken', token);
      }
      const headers = {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${token}`,
      };

      log(`Uploading ${results.length} blobs → ${saveInfo.repo}@${saveInfo.branch}…`);
      const fileEntries = [];
      let i = 0;
      for (const r of results) {
        i++;
        const path = `app/public/${r.entry.outDir}/${r.entry.outBase}.${r.ext}`;
        const sizeKB = (r.blob.size / 1024).toFixed(0);
        // Vercel gateway hard-caps request bodies at ~4.5 MB. base64 inflates
        // payload by ~33%, so refuse uploads > ~3 MB raw before the round trip.
        if (r.blob.size > 3.3 * 1024 * 1024) {
          log(`  [${i}/${results.length}] ✗ ${path} (${sizeKB} KB) — exceeds 4.5 MB body cap; lower resolution/bitrate and re-capture.`);
          continue;
        }
        const contentB64 = await blobToBase64(r.blob);
        log(`  [${i}/${results.length}] ${path} (${sizeKB} KB)`);
        let resp;
        try {
          resp = await fetch('/api/dev-prerender-upload', {
            method: 'POST',
            headers,
            body: JSON.stringify({ action: 'blob', path, contentB64 }),
          });
        } catch (err) {
          log(`    ✗ network error: ${err.message || err}`);
          alert(`Aborted at ${path}: ${err.message || err}`);
          return;
        }
        if (resp.status === 401) {
          localStorage.removeItem('prerenderAdminToken');
          log('    ✗ 401 Unauthorized — wrong admin token. Stored token cleared.');
          alert('Wrong admin token. Cleared from storage — click Send again to re-enter.');
          return;
        }
        if (!resp.ok) {
          const text = await resp.text();
          log(`    ✗ ${resp.status}: ${text}`);
          alert(`Upload failed at ${path} (${resp.status}): ${text}`);
          return;
        }
        const data = await resp.json();
        fileEntries.push({ path, sha: data.sha });
        log(`    ✓ blob ${data.sha.slice(0, 7)}`);
      }

      if (!fileEntries.length) {
        alert('No blobs uploaded — nothing to commit.');
        return;
      }

      log(`Creating commit with ${fileEntries.length} files…`);
      const message = `Add ${fileEntries.length} prerender ${results[0].ext} via dev panel`;
      let commitResp;
      try {
        commitResp = await fetch('/api/dev-prerender-upload', {
          method: 'POST',
          headers,
          body: JSON.stringify({ action: 'commit', files: fileEntries, branch: saveInfo.branch, message }),
        });
      } catch (err) {
        log(`✗ commit network error: ${err.message || err}`);
        alert(`Commit failed: ${err.message || err}`);
        return;
      }
      if (!commitResp.ok) {
        const text = await commitResp.text();
        log(`✗ commit failed (${commitResp.status}): ${text}`);
        alert(`Commit failed (${commitResp.status}): ${text}`);
        return;
      }
      const commitData = await commitResp.json();
      log(`✓ committed ${commitData.files} files → ${commitData.htmlUrl}`);
      alert(
        `Committed ${commitData.files} files to ${commitData.branch}.\n${commitData.htmlUrl}\n\n` +
        `Re-run \`npm run manifest\` (or trigger a new build) to pick them up at runtime.`,
      );
    }

    function readOpts() {
      return {
        nativeRes: parseInt($('nativeRes').value, 10) || 512,
        resMul: parseFloat($('resMul').value) || 1,
        bitrate: parseInt($('bitrate').value, 10) || 5,
        animName: ($('animName').value || 'idle').trim(),
        format: $('format').value || 'webm',
        bgMode: $('bgMode').value || 'transparent',
        bgColor: $('bgColor').value || '#000000',
      };
    }

    async function probeApi() {
      log('--- API probe ---');
      log('window.spine41: ' + (window.spine41 ? 'present' : 'missing'));
      log('window.spine42: ' + (window.spine42 ? 'present' : 'missing'));
      const supportedFormats = ['webm', 'mp4'].map(
        (f) => `${f}=${pickMime(f) ? 'YES' : 'NO'}`,
      ).join(', ');
      log('codec support: ' + supportedFormats);
      if (!spriteList.length) { log('no sprite-list.json loaded'); return; }
      const entry = spriteList[0];
      log(`probing first entry: ${entry.key} (${entry.surface}, runtime ${entry.runtime})`);

      const host = document.createElement('div');
      host.style.cssText = 'position:fixed;left:-9999px;top:0;width:512px;height:512px;';
      document.body.appendChild(host);

      try {
        const spineLib = spineLibFor(entry);
        const player = await new Promise((resolve, reject) => {
          let done = false;
          const inst = new spineLib.SpinePlayer(host, {
            ...assetUrlsFor(entry),
            animation: 'idle',
            loop: false,
            backgroundColor: '#00000000',
            alpha: true,
            premultipliedAlpha: false,
            preserveDrawingBuffer: true,
            showControls: false,
            showLoading: false,
            success: () => { done = true; resolve(inst); },
            error: (p, msg) => { if (!done) reject(new Error(msg || 'spine-player error')); },
          });
          setTimeout(() => { if (!done) reject(new Error('mount timeout (10s)')); }, 10000);
        });
        log('mount: success');
        log('player.canvas: ' + (player.canvas ? `<canvas ${player.canvas.width}x${player.canvas.height}>` : 'missing'));
        if (player.skeleton?.data) {
          const anims = (player.skeleton.data.animations || []).map((a) => `${a.name}(${a.duration.toFixed(2)}s)`);
          log('skeleton.data.animations: [' + anims.join(', ') + ']');
        }
        try { player.dispose(); } catch (e) { log('dispose threw: ' + e.message); }
      } catch (err) {
        log('probe FAILED: ' + (err.message || err));
        if (err.stack) log(err.stack);
      } finally {
        host.remove();
      }
      log('--- end probe ---');
    }

    async function captureMany(indices) {
      if (busy) return;
      busy = true;
      $('capture').disabled = true;
      $('captureOne').disabled = true;
      const opts = readOpts();
      lastResults = [];
      let done = 0;
      $('counter').textContent = `0 / ${indices.length}`;
      for (const idx of indices) {
        try {
          const r = await captureChar(idx, spriteList[idx], opts);
          lastResults.push(r);
        } catch (err) {
          console.error(err);
          setRowStatus(idx, 'status-err', String(err.message || err).slice(0, 40));
          log(`✗ ${spriteList[idx].key}: ${err.message || err}`);
        }
        done++;
        $('counter').textContent = `${done} / ${indices.length}`;
      }
      if (lastResults.length) await packZip(lastResults);
      busy = false;
      $('capture').disabled = false;
      $('captureOne').disabled = false;
    }

    $('probe').addEventListener('click', () => { probeApi().catch((e) => log('probe error: ' + e)); });
    $('capture').addEventListener('click', () => {
      const filter = $('surfaceFilter').value;
      const indices = spriteList
        .map((e, i) => (filter === 'all' || e.surface === filter ? i : -1))
        .filter((i) => i >= 0);
      captureMany(indices);
    });
    $('captureOne').addEventListener('click', () => {
      const sel = document.querySelector('#rows tr[data-selected="1"]');
      if (!sel) {
        alert('Click a row first.');
        return;
      }
      captureMany([parseInt(sel.dataset.idx, 10)]);
    });
    $('downloadZip').addEventListener('click', () => {
      if (!zipBuffer) return;
      const a = document.createElement('a');
      a.href = URL.createObjectURL(zipBuffer);
      a.download = 'spine-prerender.zip';
      a.click();
    });
    $('sendRepo').addEventListener('click', () => { sendToRepo(lastResults); });
    $('surfaceFilter').addEventListener('change', renderRows);
    $('nativeRes').addEventListener('input', updateResReadout);
    $('resMul').addEventListener('change', updateResReadout);
    $('format').addEventListener('change', () => {
      const f = $('format').value;
      if (f === 'mp4' && !pickMime('mp4')) {
        log('warning: this browser does not advertise MP4 support in MediaRecorder. Capture will fail.');
      }
      if (f === 'mp4' && $('bgMode').value === 'transparent') {
        log('note: MP4 has no alpha channel — captures will use a black background regardless of the Background setting.');
      }
    });
    $('bgMode').addEventListener('change', () => {
      const m = $('bgMode').value;
      if (m === 'transparent' && pickMime('webm') && pickMime('webm').includes('vp9')) {
        log('tip: VP9 alpha can produce mild edge fringing on partly-transparent pixels. Pick a solid background if you see white specks.');
      }
    });

    init().catch((e) => {
      log('init error: ' + (e.message || e));
    });
  </script>
</body>
</html>
