<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Zani — Mesh Warp Animation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { touch-action: none; overscroll-behavior: none; background: #080c14; }
  body { padding: 20px; color: #eee; font-family: system-ui, sans-serif; }
  h1 { font-size: 16px; margin-bottom: 10px; }
  #container { position: relative; display: inline-block; border-radius: 12px; overflow: hidden;
    background: radial-gradient(ellipse at center, #1a2234 0%, #080c14 80%); }
  canvas { display: block; }
  .controls { margin-bottom: 12px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .controls button { font-size: 12px; padding: 5px 10px; background: #222; color: #eee;
    border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  .controls button.active { background: #2a6; border-color: #0c0; }
  .controls label { font-size: 12px; color: #aaa; display: flex; align-items: center; gap: 4px; }
  .controls input[type=range] { width: 100px; }
  #info { margin-top: 8px; font-size: 11px; font-family: monospace; color: #666; }
</style>
</head>
<body>
  <h1>Zani — Polygon Mesh Warp</h1>
  <div class="controls">
    <button id="btnAnim" class="active">Animation</button>
    <button id="btnMesh">Show Mesh</button>
    <label>Stretch <input type="range" id="stretch" min="0" max="200" value="80" /></label>
    <label>Speed <input type="range" id="speed" min="0" max="200" value="100" /></label>
    <label>Grid <input type="range" id="gridSize" min="8" max="40" value="16" /></label>
  </div>
  <div id="container">
    <canvas id="canvas"></canvas>
  </div>
  <div id="info">Loading...</div>

<script>
const SPRITE_URL = 'https://i.ibb.co/5XLvmGfC/Zani-Full-Sprite-1.webp';

let spriteImg = null, imgW = 0, imgH = 0;
let doAnimate = true, showMesh = false;

// Mesh: grid of vertices + triangles covering the character
let meshVerts = [];    // [{x, y, u, v, inside}] — base positions + UV
let meshTris = [];     // [[i0,i1,i2], ...] — triangle indices
let alphaMask = null;  // Uint8Array of alpha > threshold

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');

// ── Build alpha mask at full res ──
function buildAlphaMask(img) {
  const c = document.createElement('canvas');
  c.width = imgW; c.height = imgH;
  const cx = c.getContext('2d', { willReadFrequently: true });
  cx.drawImage(img, 0, 0);
  const data = cx.getImageData(0, 0, imgW, imgH).data;
  const mask = new Uint8Array(imgW * imgH);
  for (let i = 0, p = 0; i < data.length; i += 4, p++) {
    mask[p] = data[i + 3] > 30 ? 1 : 0;
  }
  return mask;
}

// ── Check if a point is inside the character ──
function isInside(x, y) {
  if (x < 0 || y < 0 || x >= imgW || y >= imgH) return false;
  return alphaMask[Math.round(y) * imgW + Math.round(x)] === 1;
}

// ── Build grid mesh ──
function buildMesh(cellSize) {
  const cols = Math.ceil(imgW / cellSize) + 1;
  const rows = Math.ceil(imgH / cellSize) + 1;
  meshVerts = [];
  meshTris = [];

  // Create grid vertices
  const idx = (r, c) => r * cols + c;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      const x = Math.min(c * cellSize, imgW - 1);
      const y = Math.min(r * cellSize, imgH - 1);
      meshVerts.push({
        x, y,
        baseX: x, baseY: y,
        u: x / imgW, v: y / imgH,
        inside: isInside(x, y)
      });
    }
  }

  // Create triangles (2 per cell) — only if at least one vertex touches the character
  for (let r = 0; r < rows - 1; r++) {
    for (let c = 0; c < cols - 1; c++) {
      const tl = idx(r, c), tr = idx(r, c+1);
      const bl = idx(r+1, c), br = idx(r+1, c+1);
      const v = meshVerts;
      // Check if any vertex or center of quad is inside
      const cx = (v[tl].baseX + v[br].baseX) / 2;
      const cy = (v[tl].baseY + v[br].baseY) / 2;
      const anyInside = v[tl].inside || v[tr].inside || v[bl].inside || v[br].inside || isInside(cx, cy);
      if (anyInside) {
        meshTris.push([tl, tr, bl]);
        meshTris.push([tr, br, bl]);
      }
    }
  }
}

// ── Per-vertex displacement ──
function displace(v, t, amt) {
  const nx = v.baseX / imgW;
  const ny = v.baseY / imgH;
  const edge = Math.abs(nx - 0.5) * 2;
  const top = Math.max(0, 1 - ny * 4);
  const bot = Math.max(0, ny - 0.55) * 2.2;
  const mid = 1 - Math.abs(ny - 0.35) * 3;

  const dx =
    Math.sin(t * 1.1 + ny * 6) * 5 * edge +
    Math.sin(t * 0.7 + ny * 3) * 8 * top +
    Math.sin(t * 0.9 + nx * 4) * 3 * bot +
    Math.cos(t * 0.5) * 3 * (0.5 - ny);

  const dy =
    Math.sin(t * 1.3 + nx * 5) * 4 * top +
    Math.sin(t * 1.0) * 5 * Math.max(0, mid) +
    Math.cos(t * 0.8 + nx * 3) * 3 * bot +
    Math.sin(t * 0.6) * 2 * edge;

  v.x = v.baseX + dx * amt;
  v.y = v.baseY + dy * amt;
}

// ── Draw textured triangle ──
function drawTriangle(img, v0, v1, v2) {
  // Affine texture mapping using canvas transform
  // Map triangle (v0,v1,v2) with UV coords to canvas
  const x0 = v0.x, y0 = v0.y, x1 = v1.x, y1 = v1.y, x2 = v2.x, y2 = v2.y;
  const u0 = v0.u * imgW, vv0 = v0.v * imgH;
  const u1 = v1.u * imgW, vv1 = v1.v * imgH;
  const u2 = v2.u * imgW, vv2 = v2.v * imgH;

  ctx.save();
  // Clip to triangle
  ctx.beginPath();
  ctx.moveTo(x0, y0);
  ctx.lineTo(x1, y1);
  ctx.lineTo(x2, y2);
  ctx.closePath();
  ctx.clip();

  // Compute affine transform from UV space to screen space
  // We need: [a b tx; c d ty] such that
  //   (u0,v0) -> (x0,y0), (u1,v1) -> (x1,y1), (u2,v2) -> (x2,y2)
  const du1 = u1 - u0, dv1 = vv1 - vv0;
  const du2 = u2 - u0, dv2 = vv2 - vv0;
  const dx1 = x1 - x0, dy1 = y1 - y0;
  const dx2 = x2 - x0, dy2 = y2 - y0;

  const det = du1 * dv2 - du2 * dv1;
  if (Math.abs(det) < 0.001) { ctx.restore(); return; }
  const idet = 1 / det;

  const a = (dx1 * dv2 - dx2 * dv1) * idet;
  const b = (dx2 * dv1 - dx1 * dv2) * idet; // wait, let me redo this properly
  // Actually:
  // a = (dx1*dv2 - dx2*dv1) / det
  // b = (du1*dx2 - du2*dx1) / det
  // c = (dy1*dv2 - dy2*dv1) / det
  // d = (du1*dy2 - du2*dy1) / det
  const ma = (dx1 * dv2 - dx2 * dv1) * idet;
  const mb = (du1 * dx2 - du2 * dx1) * idet;
  const mc = (dy1 * dv2 - dy2 * dv1) * idet;
  const md = (du1 * dy2 - du2 * dy1) * idet;
  const mtx = x0 - ma * u0 - mb * vv0;
  const mty = y0 - mc * u0 - md * vv0;

  ctx.setTransform(ma, mc, mb, md, mtx, mty);
  ctx.drawImage(img, 0, 0);
  ctx.restore();
}

// ── Render loop ──
function render(t) {
  const time = t * 0.001 * (+document.getElementById('speed').value / 100);
  const stretchAmt = +document.getElementById('stretch').value / 100;

  ctx.clearRect(0, 0, imgW, imgH);
  if (!spriteImg || meshTris.length === 0) { requestAnimationFrame(render); return; }

  // Displace vertices
  if (doAnimate) {
    for (const v of meshVerts) displace(v, time, stretchAmt);
  } else {
    for (const v of meshVerts) { v.x = v.baseX; v.y = v.baseY; }
  }

  // Draw textured triangles
  for (const [i0, i1, i2] of meshTris) {
    drawTriangle(spriteImg, meshVerts[i0], meshVerts[i1], meshVerts[i2]);
  }

  // Draw mesh wireframe
  if (showMesh) {
    ctx.strokeStyle = '#edaf18';
    ctx.lineWidth = 0.8;
    ctx.globalAlpha = 0.5;
    for (const [i0, i1, i2] of meshTris) {
      ctx.beginPath();
      ctx.moveTo(meshVerts[i0].x, meshVerts[i0].y);
      ctx.lineTo(meshVerts[i1].x, meshVerts[i1].y);
      ctx.lineTo(meshVerts[i2].x, meshVerts[i2].y);
      ctx.closePath();
      ctx.stroke();
    }
    ctx.globalAlpha = 1;
  }

  requestAnimationFrame(render);
}

// ── Controls ──
document.getElementById('btnAnim').onclick = e => { doAnimate=!doAnimate; e.target.classList.toggle('active',doAnimate); };
document.getElementById('btnMesh').onclick = e => { showMesh=!showMesh; e.target.classList.toggle('active',showMesh); };
document.getElementById('gridSize').oninput = e => {
  buildMesh(+e.target.value);
  document.getElementById('info').textContent =
    `${imgW}x${imgH} — ${meshVerts.length} verts, ${meshTris.length} tris — grid ${e.target.value}px`;
};

// ── Load ──
const img = new Image();
img.crossOrigin = 'anonymous';
img.onload = () => {
  spriteImg = img;
  imgW = img.naturalWidth; imgH = img.naturalHeight;
  canvas.width = imgW; canvas.height = imgH;

  alphaMask = buildAlphaMask(img);
  const gs = +document.getElementById('gridSize').value;
  buildMesh(gs);

  document.getElementById('info').textContent =
    `${imgW}x${imgH} — ${meshVerts.length} verts, ${meshTris.length} tris — grid ${gs}px`;
  requestAnimationFrame(render);
};
img.onerror = () => { document.getElementById('info').textContent = 'Failed to load'; };
img.src = SPRITE_URL;
</script>
</body>
</html>
