<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zani — Skeleton Rigged</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:#080c14}
  body{padding:20px;color:#eee;font-family:system-ui,sans-serif}
  h1{font-size:16px;margin-bottom:10px}
  #container{position:relative;display:inline-block;border-radius:12px;overflow:hidden;
    background:radial-gradient(ellipse at center,#1a2234 0%,#080c14 80%)}
  canvas{display:block}
  .controls{margin-bottom:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center}
  .controls button{font-size:12px;padding:5px 10px;background:#222;color:#eee;border:1px solid #444;border-radius:4px;cursor:pointer}
  .controls button.active{background:#2a6;border-color:#0c0}
  .controls label{font-size:12px;color:#aaa;display:flex;align-items:center;gap:4px}
  .controls input[type=range]{width:100px}
  #info{margin-top:8px;font-size:11px;font-family:monospace;color:#666}
</style>
</head>
<body>
  <h1>Zani — Skeleton Rigged Animation</h1>
  <div class="controls">
    <button id="btnAnim" class="active">Animation</button>
    <button id="btnSkel">Show Skeleton</button>
    <button id="btnMesh">Show Mesh</button>
    <button id="btnPlace" style="background:#c06000;">Place Bones</button>
    <label>Intensity <input type="range" id="intensity" min="0" max="200" value="100" /></label>
    <label>Speed <input type="range" id="speed" min="0" max="200" value="100" /></label>
    <label>Zoom <input type="range" id="zoom" min="20" max="100" value="100" /></label>
  </div>
  <div id="boneList" style="margin-bottom:8px;display:none;flex-wrap:wrap;gap:4px;"></div>
  <div id="container"><canvas id="canvas"></canvas></div>
  <div id="info">Loading...</div>

<script>
const SPRITE_URL = 'https://i.ibb.co/5XLvmGfC/Zani-Full-Sprite-1.webp';
let spriteImg=null, imgW=0, imgH=0;
let doAnimate=true, showSkel=false, showMesh=false;
let alphaMask=null, meshVerts=[], meshTris=[];
const canvas=document.getElementById('canvas'), ctx=canvas.getContext('2d');

// ═══════════════════════════════════════════════════════════
// AUTO-DETECT LANDMARKS from sprite pixels, then build skeleton
// ═══════════════════════════════════════════════════════════
let BONES = [];

function detectLandmarks(srcData) {
  // 1. Character bounding box
  let cMinX=imgW,cMinY=imgH,cMaxX=0,cMaxY=0;
  for(let y=0;y<imgH;y++) for(let x=0;x<imgW;x++)
    if(srcData[(y*imgW+x)*4+3]>20){if(x<cMinX)cMinX=x;if(x>cMaxX)cMaxX=x;if(y<cMinY)cMinY=y;if(y>cMaxY)cMaxY=y;}
  const cW=cMaxX-cMinX,cH=cMaxY-cMinY;

  // 2. Per-row extents
  const rows=[];
  for(let y=cMinY;y<=cMaxY;y++){
    let l=imgW,r=0,count=0;
    for(let x=cMinX;x<=cMaxX;x++) if(srcData[(y*imgW+x)*4+3]>20){if(x<l)l=x;if(x>r)r=x;count++;}
    rows.push({y,l,r,cx:(l+r)/2,w:r-l,count});
  }

  // 3. Body center line from torso rows (30-45%)
  const torsoSlice=rows.slice(Math.round(rows.length*.30),Math.round(rows.length*.45));
  const centers=torsoSlice.map(r=>r.cx).sort((a,b)=>a-b);
  const bodyCX=centers[Math.floor(centers.length/2)];

  // 4. Find neck = narrowest point between 15-25%
  let neckRow=null,neckW=Infinity;
  for(let i=Math.round(rows.length*.15);i<Math.round(rows.length*.25);i++){
    if(rows[i].w>10&&rows[i].w<neckW){neckW=rows[i].w;neckRow=rows[i];}
  }
  const neckY=neckRow?neckRow.y:cMinY+cH*.21;
  const neckCX=neckRow?(neckRow.l+neckRow.r)/2:bodyCX;

  // 5. Find face center via skin pixels above neck
  let skinSX=0,skinSY=0,skinN=0;
  for(let y=cMinY;y<neckY;y++) for(let x=cMinX;x<=cMaxX;x++){
    const i=(y*imgW+x)*4;
    const r=srcData[i],g=srcData[i+1],b=srcData[i+2],a=srcData[i+3];
    if(a>100&&r>150&&g>100&&b>70&&b<200&&r>b+15&&(r+g+b)/3>120&&(r+g+b)/3<240&&!(r>230&&g>230&&b>230)){
      skinSX+=x;skinSY+=y;skinN++;
    }
  }
  const faceCX=skinN>0?skinSX/skinN:bodyCX;
  const faceCY=skinN>0?skinSY/skinN:cMinY+cH*.13;

  // 6. Find widest point in torso for shoulders
  let widestRow=null,widestW=0;
  for(let i=Math.round(rows.length*.22);i<Math.round(rows.length*.32);i++){
    if(rows[i].w>widestW){widestW=rows[i].w;widestRow=rows[i];}
  }
  const shoulderY=widestRow?widestRow.y:cMinY+cH*.25;
  const shoulderL=widestRow?widestRow.l:cMinX+cW*.25;
  const shoulderR=widestRow?widestRow.r:cMinX+cW*.75;

  // 7. Find hip = widest point around 42-50%
  let hipRow=null,hipW=0;
  for(let i=Math.round(rows.length*.42);i<Math.round(rows.length*.50);i++){
    if(rows[i].w>hipW){hipW=rows[i].w;hipRow=rows[i];}
  }
  const hipY=hipRow?hipRow.y:cMinY+cH*.46;
  const hipCX=hipRow?(hipRow.l+hipRow.r)/2:bodyCX;

  // 8. Find feet = bottom of character per leg half
  let footLY=cMaxY,footRY=cMaxY,footLX=bodyCX-cW*.05,footRX=bodyCX+cW*.05;
  // Scan bottom rows for left/right extent
  for(let i=rows.length-1;i>rows.length*.85;i--){
    const r=rows[i];
    if(r.count>5){
      const mid=(r.l+r.r)/2;
      if(mid<bodyCX){footLY=r.y;footLX=mid;break;}
    }
  }
  for(let i=rows.length-1;i>rows.length*.85;i--){
    const r=rows[i];
    if(r.count>5){
      const mid=(r.l+r.r)/2;
      if(mid>=bodyCX){footRY=r.y;footRX=mid;break;}
    }
  }

  // 9. Find top of head (highest opaque pixel near center)
  let headTopY=cMinY;
  for(let y=cMinY;y<cMinY+cH*.1;y++){
    for(let x=Math.round(faceCX-cW*.15);x<Math.round(faceCX+cW*.15);x++){
      if(x>=0&&x<imgW&&srcData[(y*imgW+x)*4+3]>20){headTopY=y;break;}
    }
    if(headTopY<cMinY+2)break;
  }

  // 10. Find hand positions — leftmost/rightmost points around elbow height
  const elbowPct=.33;
  const elbowRowIdx=Math.round(rows.length*elbowPct);
  const elbowRow=rows[elbowRowIdx];
  const handLPct=.38;
  const handRowIdx=Math.round(rows.length*handLPct);
  const handRow=rows[handRowIdx];

  // Normalize to 0-1
  const n=(px,py)=>({nx:px/imgW, ny:py/imgH});

  const root=n(hipCX,hipY);
  const spine=n(bodyCX,cMinY+cH*.35);
  const chest=n(bodyCX,shoulderY+cH*.02);
  const neck=n(neckCX,neckY);
  const head=n(faceCX,faceCY);
  const hairTop=n(faceCX,headTopY);

  BONES = [
    {name:'root',     parent:null,      ...root,     len:0},
    {name:'spine',    parent:'root',    ...spine,    len:0.09},
    {name:'chest',    parent:'spine',   ...chest,    len:0.08},
    {name:'neck',     parent:'chest',   ...neck,     len:0.07},
    {name:'head',     parent:'neck',    ...head,     len:0.07},
    {name:'hair_top', parent:'head',    ...hairTop,  len:0.08},
    {name:'hair_l',   parent:'head',    nx:head.nx-0.08, ny:head.ny+0.03, len:0.06},
    {name:'hair_r',   parent:'head',    nx:head.nx+0.08, ny:head.ny+0.01, len:0.05},
    {name:'shldr_l',  parent:'chest',   nx:shoulderL/imgW+0.02, ny:shoulderY/imgH, len:0.08},
    {name:'elbow_l',  parent:'shldr_l', nx:elbowRow?elbowRow.l/imgW+0.02:0.28, ny:elbowPct, len:0.08},
    {name:'hand_l',   parent:'elbow_l', nx:handRow?handRow.l/imgW+0.03:0.30, ny:handLPct, len:0.06},
    {name:'shldr_r',  parent:'chest',   nx:shoulderR/imgW-0.02, ny:shoulderY/imgH, len:0.08},
    {name:'elbow_r',  parent:'shldr_r', nx:elbowRow?elbowRow.r/imgW-0.02:0.56, ny:elbowPct, len:0.08},
    {name:'hand_r',   parent:'elbow_r', nx:handRow?handRow.r/imgW-0.03:0.54, ny:handLPct, len:0.07},
    {name:'hip_l',    parent:'root',    nx:root.nx-0.02, ny:root.ny+0.02, len:0.04},
    {name:'knee_l',   parent:'hip_l',   nx:root.nx-0.03, ny:root.ny+0.20, len:0.18},
    {name:'foot_l',   parent:'knee_l',  nx:footLX/imgW, ny:footLY/imgH, len:0.23},
    {name:'hip_r',    parent:'root',    nx:root.nx+0.02, ny:root.ny+0.02, len:0.04},
    {name:'knee_r',   parent:'hip_r',   nx:root.nx+0.02, ny:root.ny+0.18, len:0.16},
    {name:'foot_r',   parent:'knee_r',  nx:footRX/imgW, ny:footRY/imgH, len:0.22},
    {name:'cape_top', parent:'chest',   nx:chest.nx-0.10, ny:chest.ny, len:0.06},
    {name:'cape_mid', parent:'cape_top',nx:chest.nx-0.22, ny:chest.ny+0.14, len:0.15},
    {name:'cape_tip', parent:'cape_mid',nx:chest.nx-0.30, ny:chest.ny+0.32, len:0.18},
    {name:'weapon',   parent:'hand_r',  nx:(handRow?handRow.r/imgW:0.54)+0.10, ny:handLPct+0.12, len:0.15},
  ];
}

let bones = []; // runtime bone data

function initBones() {
  bones = BONES.map(def => ({
    ...def,
    // World position in pixels
    wx: def.nx * imgW, wy: def.ny * imgH,
    // Base angle (computed from parent->child direction)
    baseAngle: 0,
    // Current animation rotation delta (radians)
    animRot: 0,
    // Resolved world transform
    worldX: 0, worldY: 0, worldAngle: 0,
    parentIdx: -1
  }));
  // Link parents
  for (let i = 0; i < bones.length; i++) {
    if (bones[i].parent) {
      bones[i].parentIdx = bones.findIndex(b => b.name === bones[i].parent);
    }
    // Compute base angle from parent
    if (bones[i].parentIdx >= 0) {
      const p = bones[bones[i].parentIdx];
      bones[i].baseAngle = Math.atan2(bones[i].wy - p.wy, bones[i].wx - p.wx);
    }
  }
}

// ═══════════════════════════════════════════════════════════
// IDLE ANIMATION — rotation per bone (radians)
// ═══════════════════════════════════════════════════════════
function animateBones(t, intensity) {
  const s = intensity;
  const breath = Math.sin(t * 0.9);
  const sway = Math.sin(t * 0.35);

  for (const b of bones) {
    b.animRot = 0;
    switch(b.name) {
      case 'root':
        b.animRot = sway * 0.008 * s; break;          // very subtle body lean
      case 'spine':
        b.animRot = breath * 0.015 * s; break;         // breathing tilt
      case 'chest':
        b.animRot = breath * 0.012 * s + sway * 0.005 * s; break;
      case 'neck':
        b.animRot = -breath * 0.02 * s + Math.sin(t*0.5) * 0.01 * s; break;
      case 'head':
        b.animRot = Math.sin(t*0.4) * 0.025 * s + breath * 0.01 * s; break;
      case 'hair_top':
        b.animRot = Math.sin(t*0.6) * 0.06 * s + Math.sin(t*1.3) * 0.03 * s; break;
      case 'hair_l':
        b.animRot = Math.sin(t*0.55+0.3) * 0.07 * s; break;
      case 'hair_r':
        b.animRot = Math.sin(t*0.55+0.8) * 0.05 * s; break;
      case 'shldr_l':
        b.animRot = breath * 0.02 * s + sway * 0.01 * s; break;
      case 'elbow_l':
        b.animRot = Math.sin(t*0.5+0.2) * 0.03 * s; break;
      case 'hand_l':
        b.animRot = Math.sin(t*0.7) * 0.04 * s; break;
      case 'shldr_r':
        b.animRot = breath * -0.015 * s + sway * 0.01 * s; break;
      case 'elbow_r':
        b.animRot = Math.sin(t*0.5+0.5) * 0.025 * s; break;
      case 'hand_r':
        b.animRot = Math.sin(t*0.65+0.3) * 0.03 * s; break;
      case 'hip_l':
        b.animRot = sway * -0.008 * s; break;
      case 'knee_l':
        b.animRot = Math.sin(t*0.45) * 0.012 * s; break;
      case 'foot_l': break;                             // planted
      case 'hip_r':
        b.animRot = sway * 0.008 * s; break;
      case 'knee_r':
        b.animRot = Math.sin(t*0.45+0.4) * 0.01 * s; break;
      case 'foot_r': break;
      case 'cape_top':
        b.animRot = Math.sin(t*0.6) * 0.04 * s + sway * 0.03 * s; break;
      case 'cape_mid':
        b.animRot = Math.sin(t*0.7+0.5) * 0.08 * s; break;
      case 'cape_tip':
        b.animRot = Math.sin(t*0.8+1.0) * 0.12 * s; break;
      case 'weapon':
        b.animRot = Math.sin(t*0.35-0.5) * 0.02 * s; break;
    }
  }
}

// ═══════════════════════════════════════════════════════════
// FORWARD KINEMATICS — resolve world transforms
// ═══════════════════════════════════════════════════════════
function solveFK() {
  for (const b of bones) {
    if (b.parentIdx < 0) {
      b.worldX = b.wx;
      b.worldY = b.wy;
      b.worldAngle = b.animRot;
    } else {
      const p = bones[b.parentIdx];
      const angle = b.baseAngle + b.animRot + p.worldAngle;
      const dist = Math.hypot(b.wx - bones[b.parentIdx].wx, b.wy - bones[b.parentIdx].wy);
      b.worldX = p.worldX + Math.cos(angle) * dist;
      b.worldY = p.worldY + Math.sin(angle) * dist;
      b.worldAngle = angle - b.baseAngle + b.animRot;
    }
  }
}

// ═══════════════════════════════════════════════════════════
// SKINNING — assign each mesh vertex to nearest bones
// ═══════════════════════════════════════════════════════════
function skinVertices() {
  for (const v of meshVerts) {
    // Find 2 nearest bones
    const dists = bones.map((b, i) => ({ i, d: Math.hypot(v.baseX - b.wx, v.baseY - b.wy) }));
    dists.sort((a, b) => a.d - b.d);
    const b0 = dists[0], b1 = dists[1];
    const totalInv = 1/b0.d + 1/b1.d;
    v.boneWeights = [
      { idx: b0.i, w: (1/b0.d) / totalInv },
      { idx: b1.i, w: (1/b1.d) / totalInv },
    ];
  }
}

// ═══════════════════════════════════════════════════════════
// VERTEX TRANSFORM — apply bone transforms via LBS
// ═══════════════════════════════════════════════════════════
function transformVertices() {
  for (const v of meshVerts) {
    let fx = 0, fy = 0;
    for (const { idx, w } of v.boneWeights) {
      const b = bones[idx];
      // Delta from bone's base position
      const dx = v.baseX - b.wx;
      const dy = v.baseY - b.wy;
      // Rotate delta by bone's world rotation
      const rot = b.worldAngle;
      const rx = dx * Math.cos(rot) - dy * Math.sin(rot);
      const ry = dx * Math.sin(rot) + dy * Math.cos(rot);
      // Translate to bone's current world position
      fx += (b.worldX + rx) * w;
      fy += (b.worldY + ry) * w;
    }
    v.x = fx;
    v.y = fy;
  }
}

// ═══════════════════════════════════════════════════════════
// MESH — grid triangulation on character alpha
// ═══════════════════════════════════════════════════════════
function buildAlphaMask(img) {
  const c=document.createElement('canvas');c.width=imgW;c.height=imgH;
  const cx=c.getContext('2d',{willReadFrequently:true});
  cx.drawImage(img,0,0);
  const data=cx.getImageData(0,0,imgW,imgH).data;
  const mask=new Uint8Array(imgW*imgH);
  for(let i=0,p=0;i<data.length;i+=4,p++) mask[p]=data[i+3]>30?1:0;
  return mask;
}
function isInside(x,y){
  if(x<0||y<0||x>=imgW||y>=imgH)return false;
  return alphaMask[Math.round(y)*imgW+Math.round(x)]===1;
}
function buildMesh(cellSize){
  const cols=Math.ceil(imgW/cellSize)+1, rows=Math.ceil(imgH/cellSize)+1;
  meshVerts=[]; meshTris=[];
  const idx=(r,c)=>r*cols+c;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){
    const x=Math.min(c*cellSize,imgW-1), y=Math.min(r*cellSize,imgH-1);
    meshVerts.push({x,y,baseX:x,baseY:y,u:x/imgW,v:y/imgH,inside:isInside(x,y),boneWeights:[]});
  }
  for(let r=0;r<rows-1;r++)for(let c=0;c<cols-1;c++){
    const tl=idx(r,c),tr=idx(r,c+1),bl=idx(r+1,c),br=idx(r+1,c+1);
    const cx2=(meshVerts[tl].baseX+meshVerts[br].baseX)/2;
    const cy2=(meshVerts[tl].baseY+meshVerts[br].baseY)/2;
    if(meshVerts[tl].inside||meshVerts[tr].inside||meshVerts[bl].inside||meshVerts[br].inside||isInside(cx2,cy2)){
      meshTris.push([tl,tr,bl]); meshTris.push([tr,br,bl]);
    }
  }
}

// ═══════════════════════════════════════════════════════════
// TEXTURED TRIANGLE with bleed
// ═══════════════════════════════════════════════════════════
function drawTri(img,v0,v1,v2){
  const x0=v0.x,y0=v0.y,x1=v1.x,y1=v1.y,x2=v2.x,y2=v2.y;
  const u0=v0.u*imgW,w0=v0.v*imgH,u1=v1.u*imgW,w1=v1.v*imgH,u2=v2.u*imgW,w2=v2.v*imgH;
  const cx2=(x0+x1+x2)/3,cy2=(y0+y1+y2)/3;
  const bl=0.6;
  const expand=(px,py)=>{const d=Math.hypot(px-cx2,py-cy2)||1;return[px+(px-cx2)/d*bl,py+(py-cy2)/d*bl];};
  const[bx0,by0]=expand(x0,y0),[bx1,by1]=expand(x1,y1),[bx2,by2]=expand(x2,y2);
  ctx.save();
  ctx.beginPath();ctx.moveTo(bx0,by0);ctx.lineTo(bx1,by1);ctx.lineTo(bx2,by2);ctx.closePath();ctx.clip();
  const du1=u1-u0,dv1=w1-w0,du2=u2-u0,dv2=w2-w0;
  const dx1=x1-x0,dy1=y1-y0,dx2=x2-x0,dy2=y2-y0;
  const det=du1*dv2-du2*dv1;
  if(Math.abs(det)<0.001){ctx.restore();return;}
  const id=1/det;
  const ma=(dx1*dv2-dx2*dv1)*id,mb=(du1*dx2-du2*dx1)*id;
  const mc=(dy1*dv2-dy2*dv1)*id,md=(du1*dy2-du2*dy1)*id;
  ctx.setTransform(ma,mc,mb,md,x0-ma*u0-mb*w0,y0-mc*u0-md*w0);
  ctx.drawImage(img,0,0);
  ctx.restore();
}

// ═══════════════════════════════════════════════════════════
// RENDER
// ═══════════════════════════════════════════════════════════
function render(t){
  const time=t*0.001*(+document.getElementById('speed').value/100);
  const intensity=+document.getElementById('intensity').value/100;
  ctx.clearRect(0,0,imgW,imgH);
  if(!spriteImg){requestAnimationFrame(render);return;}

  if(doAnimate){
    animateBones(time,intensity);
    solveFK();
    transformVertices();
  } else {
    for(const v of meshVerts){v.x=v.baseX;v.y=v.baseY;}
  }

  // Draw textured mesh
  for(const[i0,i1,i2]of meshTris) drawTri(spriteImg,meshVerts[i0],meshVerts[i1],meshVerts[i2]);

  // Draw mesh wireframe
  if(showMesh){
    ctx.strokeStyle='rgba(255,200,50,0.3)';ctx.lineWidth=0.5;
    for(const[i0,i1,i2]of meshTris){
      ctx.beginPath();ctx.moveTo(meshVerts[i0].x,meshVerts[i0].y);
      ctx.lineTo(meshVerts[i1].x,meshVerts[i1].y);ctx.lineTo(meshVerts[i2].x,meshVerts[i2].y);
      ctx.closePath();ctx.stroke();
    }
  }

  // Draw skeleton
  if(showSkel){
    for(const b of bones){
      if(b.parentIdx>=0){
        const p=bones[b.parentIdx];
        ctx.strokeStyle='#0ff';ctx.lineWidth=2;
        ctx.beginPath();ctx.moveTo(p.worldX,p.worldY);ctx.lineTo(b.worldX,b.worldY);ctx.stroke();
      }
      // Joint dot — highlight selected bone
      const bIdx=bones.indexOf(b);
      const isSel=placingBones&&bIdx===selectedBone;
      const isDrag=placingBones&&bIdx===draggingBone;
      ctx.fillStyle=isDrag?'#f00':isSel?'#0f0':'#ff0';
      ctx.beginPath();ctx.arc(b.worldX,b.worldY,isSel||isDrag?7:4,0,Math.PI*2);ctx.fill();
      // Label
      ctx.fillStyle=isSel?'#0f0':'#0ff';ctx.font=(isSel?'bold 12':'10')+'px monospace';
      ctx.fillText(b.name,b.worldX+8,b.worldY-4);
    }
  }

  requestAnimationFrame(render);
}

// ═══════════════════════════════════════════════════════════
// BONE PLACEMENT MODE
// ═══════════════════════════════════════════════════════════
let placingBones = false;
let selectedBone = null;
let draggingBone = null;
let zoomLevel = 1;

function buildBoneButtons() {
  const list = document.getElementById('boneList');
  list.innerHTML = '';
  BONES.forEach((def, i) => {
    const btn = document.createElement('button');
    btn.textContent = def.name;
    btn.style.cssText = 'font-size:10px;padding:3px 6px;background:#333;color:#eee;border:1px solid #555;border-radius:3px;cursor:pointer;';
    btn.onclick = () => {
      selectedBone = i;
      document.querySelectorAll('#boneList button').forEach(b => b.style.outline = '');
      btn.style.outline = '2px solid #ff0';
      document.getElementById('info').textContent = `Click on sprite to place: ${def.name}`;
    };
    list.appendChild(btn);
  });
}

function rebuildAfterPlace() {
  initBones();
  buildMesh(18);
  skinVertices();
  animateBones(0, 0); solveFK();
}

// Click to place or drag bone
canvas.addEventListener('pointerdown', (e) => {
  if (!placingBones || !spriteImg) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width * imgW;
  const py = (e.clientY - rect.top) / rect.height * imgH;

  // Check if clicking near an existing bone to drag it
  for (let i = 0; i < bones.length; i++) {
    if (Math.hypot(bones[i].wx - px, bones[i].wy - py) < 15) {
      draggingBone = i;
      return;
    }
  }

  // Otherwise place the selected bone
  if (selectedBone !== null && selectedBone < BONES.length) {
    BONES[selectedBone].nx = px / imgW;
    BONES[selectedBone].ny = py / imgH;
    rebuildAfterPlace();
    document.getElementById('info').textContent =
      `Placed ${BONES[selectedBone].name} at (${Math.round(px)}, ${Math.round(py)})`;
    // Auto-advance to next bone
    if (selectedBone < BONES.length - 1) {
      selectedBone++;
      const btns = document.querySelectorAll('#boneList button');
      btns.forEach(b => b.style.outline = '');
      if (btns[selectedBone]) btns[selectedBone].style.outline = '2px solid #ff0';
    }
  }
});

canvas.addEventListener('pointermove', (e) => {
  if (draggingBone === null || !placingBones) return;
  e.preventDefault();
  const rect = canvas.getBoundingClientRect();
  const px = (e.clientX - rect.left) / rect.width * imgW;
  const py = (e.clientY - rect.top) / rect.height * imgH;
  BONES[draggingBone].nx = px / imgW;
  BONES[draggingBone].ny = py / imgH;
  rebuildAfterPlace();
  document.getElementById('info').textContent =
    `Dragging ${BONES[draggingBone].name} → (${Math.round(px)}, ${Math.round(py)})`;
});

canvas.addEventListener('pointerup', () => { draggingBone = null; });
canvas.addEventListener('pointercancel', () => { draggingBone = null; });

// Controls
document.getElementById('btnAnim').onclick=e=>{doAnimate=!doAnimate;e.target.classList.toggle('active',doAnimate);};
document.getElementById('btnSkel').onclick=e=>{showSkel=!showSkel;e.target.classList.toggle('active',showSkel);};
document.getElementById('btnMesh').onclick=e=>{showMesh=!showMesh;e.target.classList.toggle('active',showMesh);};

document.getElementById('btnPlace').onclick=e=>{
  placingBones=!placingBones;
  e.target.classList.toggle('active',placingBones);
  const list=document.getElementById('boneList');
  list.style.display=placingBones?'flex':'none';
  if(placingBones){
    doAnimate=false;document.getElementById('btnAnim').classList.remove('active');
    showSkel=true;document.getElementById('btnSkel').classList.add('active');
    buildBoneButtons();
    selectedBone=0;
    document.querySelectorAll('#boneList button')[0]?.click();
    document.getElementById('info').textContent='Click on sprite to place bones. Drag existing joints to move them.';
  }
};

document.getElementById('zoom').oninput=e=>{
  zoomLevel=+e.target.value/100;
  canvas.style.width=Math.round(imgW*zoomLevel)+'px';
  canvas.style.height=Math.round(imgH*zoomLevel)+'px';
};

// Load
const img=new Image();img.crossOrigin='anonymous';
img.onload=()=>{
  spriteImg=img;imgW=img.naturalWidth;imgH=img.naturalHeight;
  canvas.width=imgW;canvas.height=imgH;
  alphaMask=buildAlphaMask(img);

  // Auto-detect body landmarks from pixel data
  const tmp2=document.createElement('canvas');tmp2.width=imgW;tmp2.height=imgH;
  const tctx2=tmp2.getContext('2d');tctx2.drawImage(img,0,0);
  const srcPx=tctx2.getImageData(0,0,imgW,imgH).data;
  detectLandmarks(srcPx);

  buildMesh(18);
  initBones();
  skinVertices();
  animateBones(0,0);solveFK();

  showSkel=true; document.getElementById('btnSkel').classList.add('active');

  document.getElementById('info').textContent=
    `${imgW}x${imgH} — ${bones.length} bones — click "Place Bones" to position manually`;
  requestAnimationFrame(render);
};
img.onerror=()=>{document.getElementById('info').textContent='Failed to load';};
img.src=SPRITE_URL;
</script>
</body>
</html>
