<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
<title>Zani Sprite Segmentation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { touch-action: none; overscroll-behavior: none; }
  body { background: #111; color: #eee; font-family: system-ui, sans-serif; padding: 20px; }
  h1 { font-size: 18px; margin-bottom: 12px; }
  #container { position: relative; display: inline-block; touch-action: none; }
  #spriteCanvas { display: block; }
  #overlay { position: absolute; top: 0; left: 0; cursor: crosshair; touch-action: none; }
  .controls { margin-bottom: 16px; display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  .controls button {
    font-size: 12px; padding: 5px 10px;
    border: 2px solid #444; border-radius: 4px; cursor: pointer;
    color: #fff; font-weight: 600;
  }
  .controls button.active { outline: 3px solid #fff; outline-offset: 2px; }
  .controls button.tool { background: #333; border-color: #555; }
  .controls label { font-size: 12px; color: #aaa; display: flex; align-items: center; gap: 4px; }
  .controls input[type=range] { width: 80px; }
  #info { margin-top: 12px; font-size: 12px; font-family: monospace; color: #aaa; min-height: 20px; }
</style>
</head>
<body>
  <h1>Zani Sprite Segmentation — Pen Tool</h1>
  <div class="controls">
    <button data-zone="head" style="background:#e040e0;">Head</button>
    <button data-zone="face" style="background:#e07040;">Face</button>
    <button data-zone="hair" style="background:#40e040;">Hair</button>
    <button data-zone="torso" style="background:#4080e0;">Torso</button>
    <button data-zone="arm_r" style="background:#e04040;">Arm R</button>
    <button data-zone="arm_l" style="background:#c06040;">Arm L</button>
    <button data-zone="hip" style="background:#a040c0;">Hip</button>
    <button data-zone="leg_r" style="background:#40c080;">Leg R</button>
    <button data-zone="leg_l" style="background:#80c040;">Leg L</button>
    <button data-zone="objet" style="background:#c0c0c0; color:#222;">Objet</button>
    <span style="color:#555;">|</span>
    <button id="btnEraser" class="tool">Eraser</button>
    <button id="btnUndo" class="tool">Undo</button>
    <button id="btnClear" class="tool">Clear All</button>
    <label>Size <input type="range" id="penSize" min="2" max="40" value="8" /></label>
  </div>
  <div id="container">
    <canvas id="spriteCanvas"></canvas>
    <canvas id="overlay"></canvas>
  </div>
  <div id="info">Loading Zani full sprite...</div>

<script>
const SPRITE_URL = 'https://i.ibb.co/5XLvmGfC/Zani-Full-Sprite-1.webp';

const ZONES = {
  head:   { color: '#e040e0', label: 'Head' },
  face:   { color: '#e07040', label: 'Face' },
  hair:   { color: '#40e040', label: 'Hair' },
  torso:  { color: '#4080e0', label: 'Torso' },
  arm_r:  { color: '#e04040', label: 'Arm R' },
  arm_l:  { color: '#c06040', label: 'Arm L' },
  hip:    { color: '#a040c0', label: 'Hip' },
  leg_r:  { color: '#40c080', label: 'Leg R' },
  leg_l:  { color: '#80c040', label: 'Leg L' },
  objet:  { color: '#c0c0c0', label: 'Objet' },
};

let spriteImg = null;
let imgW = 0, imgH = 0;
let currentZone = 'head';
let isEraser = false;
let penSize = 8;
let drawing = false;
let lastPt = null;

const strokes = [];
let currentStroke = null;

const canvas = document.getElementById('spriteCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');

// Prevent all default touch behaviors on the whole page
document.addEventListener('touchstart', e => { if (e.target === overlay) e.preventDefault(); }, { passive: false });
document.addEventListener('touchmove', e => { if (e.target === overlay) e.preventDefault(); }, { passive: false });
document.addEventListener('touchend', e => { if (e.target === overlay) e.preventDefault(); }, { passive: false });
// Prevent context menu on long press
overlay.addEventListener('contextmenu', e => e.preventDefault());

function drawBase() {
  if (!spriteImg) return;
  ctx.clearRect(0, 0, imgW, imgH);
  ctx.drawImage(spriteImg, 0, 0, imgW, imgH);

  const baseData = ctx.getImageData(0, 0, imgW, imgH);
  const d = baseData.data;
  for (let i = 0; i < d.length; i += 4) {
    if (d[i + 3] < 20) {
      d[i] = 200; d[i+1] = 0; d[i+2] = 0; d[i+3] = 180;
    }
  }
  ctx.putImageData(baseData, 0, 0);
}

function redrawOverlay() {
  octx.clearRect(0, 0, imgW, imgH);
  for (const s of strokes) {
    if (s.eraser) {
      octx.globalCompositeOperation = 'destination-out';
    } else {
      octx.globalCompositeOperation = 'source-over';
      octx.strokeStyle = ZONES[s.zone]?.color || '#fff';
      octx.globalAlpha = 0.55;
    }
    octx.lineWidth = s.size;
    octx.lineCap = 'round';
    octx.lineJoin = 'round';
    if (s.points.length > 0) {
      octx.beginPath();
      octx.moveTo(s.points[0].x, s.points[0].y);
      for (let i = 1; i < s.points.length; i++) {
        octx.lineTo(s.points[i].x, s.points[i].y);
      }
      octx.stroke();
    }
    octx.globalAlpha = 1;
    octx.globalCompositeOperation = 'source-over';
  }
}

function toCanvasCoords(e) {
  const rect = overlay.getBoundingClientRect();
  // Support both mouse and touch
  const clientX = e.clientX ?? e.touches?.[0]?.clientX ?? 0;
  const clientY = e.clientY ?? e.touches?.[0]?.clientY ?? 0;
  return {
    x: (clientX - rect.left) * (imgW / rect.width),
    y: (clientY - rect.top) * (imgH / rect.height),
  };
}

function updateInfo(text) {
  document.getElementById('info').textContent = text;
}

function strokeLine(from, to) {
  if (currentStroke.eraser) {
    octx.globalCompositeOperation = 'destination-out';
  } else {
    octx.globalCompositeOperation = 'source-over';
    octx.strokeStyle = ZONES[currentStroke.zone]?.color || '#fff';
    octx.globalAlpha = 0.55;
  }
  octx.lineWidth = currentStroke.size;
  octx.lineCap = 'round';
  octx.lineJoin = 'round';
  octx.beginPath();
  octx.moveTo(from.x, from.y);
  octx.lineTo(to.x, to.y);
  octx.stroke();
  octx.globalAlpha = 1;
  octx.globalCompositeOperation = 'source-over';
}

// Pointer events (works for both mouse and touch)
overlay.addEventListener('pointerdown', (e) => {
  e.preventDefault();
  drawing = true;
  overlay.setPointerCapture(e.pointerId);
  const pt = toCanvasCoords(e);
  currentStroke = { zone: currentZone, points: [pt], size: penSize, eraser: isEraser };
  lastPt = pt;
});

overlay.addEventListener('pointermove', (e) => {
  e.preventDefault();
  if (!drawing || !currentStroke) return;
  const pt = toCanvasCoords(e);
  currentStroke.points.push(pt);
  strokeLine(lastPt, pt);
  lastPt = pt;
});

overlay.addEventListener('pointerup', (e) => {
  e.preventDefault();
  if (currentStroke && currentStroke.points.length > 0) {
    strokes.push(currentStroke);
  }
  currentStroke = null;
  drawing = false;
  lastPt = null;
});

overlay.addEventListener('pointercancel', () => {
  currentStroke = null;
  drawing = false;
  lastPt = null;
});

// Zone buttons
document.querySelectorAll('[data-zone]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentZone = btn.dataset.zone;
    isEraser = false;
    document.querySelectorAll('[data-zone],.tool').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    overlay.style.cursor = 'crosshair';
    updateInfo(`Pen: ${ZONES[currentZone].label} (${ZONES[currentZone].color})`);
  });
});

document.getElementById('btnEraser').onclick = () => {
  isEraser = true;
  document.querySelectorAll('[data-zone],.tool').forEach(b => b.classList.remove('active'));
  document.getElementById('btnEraser').classList.add('active');
  overlay.style.cursor = 'cell';
  updateInfo('Eraser mode');
};

document.getElementById('btnUndo').onclick = () => {
  strokes.pop();
  redrawOverlay();
  updateInfo('Undid last stroke');
};

document.getElementById('btnClear').onclick = () => {
  strokes.length = 0;
  redrawOverlay();
  updateInfo('All strokes cleared');
};

document.getElementById('penSize').oninput = (e) => { penSize = +e.target.value; };

// Select head by default
document.querySelector('[data-zone="head"]').classList.add('active');

// Load sprite
const img = new Image();
img.crossOrigin = 'anonymous';
img.onload = () => {
  spriteImg = img;
  imgW = img.naturalWidth;
  imgH = img.naturalHeight;
  canvas.width = imgW; canvas.height = imgH;
  overlay.width = imgW; overlay.height = imgH;
  overlay.style.width = imgW + 'px';
  overlay.style.height = imgH + 'px';
  drawBase();
  updateInfo(`Loaded: ${imgW}x${imgH} — Select a zone and draw`);
};
img.onerror = () => updateInfo('Failed to load sprite image');
img.src = SPRITE_URL;

window.getStrokes = () => JSON.stringify(strokes);
</script>
</body>
</html>
