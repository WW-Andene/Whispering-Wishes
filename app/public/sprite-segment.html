<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Zani Sprite Segmentation</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #111; color: #eee; font-family: system-ui, sans-serif; padding: 20px; }
  h1 { font-size: 18px; margin-bottom: 12px; }
  #container { position: relative; display: inline-block; }
  #spriteCanvas { display: block; }
  #overlay { position: absolute; top: 0; left: 0; cursor: crosshair; }
  .controls { margin-bottom: 16px; display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
  .controls button { font-size: 13px; padding: 6px 12px; background: #222; color: #eee; border: 1px solid #444; border-radius: 4px; cursor: pointer; }
  .controls button:hover { background: #333; }
  .controls button.active { background: #2a6; color: #fff; border-color: #0c0; }
  #info { margin-top: 12px; font-size: 12px; font-family: monospace; color: #aaa; min-height: 40px; }
  #regionList { margin-top: 16px; font-size: 12px; font-family: monospace; color: #ccc; }
</style>
</head>
<body>
  <h1>Zani Sprite Segmentation — Full Sprite</h1>
  <div class="controls">
    <button id="btnHead" class="active" data-group="head">Head</button>
    <button id="btnHair" class="active" data-group="hair">Hair</button>
    <button id="btnHorn" class="active" data-group="horn">Horn</button>
    <button id="btnNeck" class="active" data-group="neck">Neck</button>
    <button id="btnFace" class="active" data-group="face">Face</button>
    <button id="btnClear">Clear All</button>
    <button id="btnApply" class="active">Apply Green Filter</button>
  </div>
  <div id="container">
    <canvas id="spriteCanvas"></canvas>
    <canvas id="overlay"></canvas>
  </div>
  <div id="info">Loading Zani full sprite...</div>
  <div id="regionList"></div>

<script>
const SPRITE_URL = 'https://i.ibb.co/5XLvmGfC/Zani-Full-Sprite-1.webp';

// Predefined body part regions (approximate pixel regions on the full sprite)
// These will be refined using DV visual recognition tools
const BODY_REGIONS = {
  head: { label: 'Head', color: 'rgba(0,255,0,0.30)', rects: [] },
  hair: { label: 'Hair', color: 'rgba(0,255,0,0.30)', rects: [] },
  horn: { label: 'Horn', color: 'rgba(0,255,0,0.30)', rects: [] },
  neck: { label: 'Neck', color: 'rgba(0,255,0,0.30)', rects: [] },
  face: { label: 'Face', color: 'rgba(0,255,0,0.30)', rects: [] },
};

let spriteImg = null;
let imgW = 0, imgH = 0;
let showGreen = true;
let activeGroups = new Set(['head', 'hair', 'horn', 'neck', 'face']);

// Drawing state for manual region marking
let isDrawing = false;
let drawStart = null;
let currentGroup = 'head';

const canvas = document.getElementById('spriteCanvas');
const ctx = canvas.getContext('2d');
const overlay = document.getElementById('overlay');
const octx = overlay.getContext('2d');

function draw() {
  if (!spriteImg) return;
  canvas.width = imgW;
  canvas.height = imgH;
  overlay.width = imgW;
  overlay.height = imgH;
  overlay.style.width = imgW + 'px';
  overlay.style.height = imgH + 'px';

  ctx.clearRect(0, 0, imgW, imgH);
  ctx.drawImage(spriteImg, 0, 0, imgW, imgH);

  octx.clearRect(0, 0, imgW, imgH);

  if (showGreen) {
    octx.drawImage(spriteImg, 0, 0, imgW, imgH);
    const overlayData = octx.getImageData(0, 0, imgW, imgH);
    const d = overlayData.data;
    for (let px = 0; px < d.length; px += 4) {
      const x = (px / 4) % imgW;
      const y = Math.floor((px / 4) / imgW);
      if (d[px + 3] > 20) {
        // Opaque pixel — check if in head region (between headCutTop and headCutBottom)
        if (typeof window._headCutTop !== 'undefined' && y >= window._headCutTop && y <= window._headCutBottom) {
          // Purple filter on face/hair/horn region
          d[px]     = Math.round(d[px] * 0.3 + 140);     // R boosted
          d[px + 1] = Math.round(d[px + 1] * 0.2);       // G reduced
          d[px + 2] = Math.round(d[px + 2] * 0.3 + 180); // B boosted
          d[px + 3] = 220;
        } else {
          // Green layer: 0% opacity (present but invisible)
          d[px + 3] = 0;
        }
      } else {
        // Red fill on transparent pixels
        d[px]     = 200;
        d[px + 1] = 0;
        d[px + 2] = 0;
        d[px + 3] = 180;
      }
    }
    octx.putImageData(overlayData, 0, 0);

    // Draw horizontal cut lines
    if (typeof window._headCutTop !== 'undefined') {
      octx.strokeStyle = '#ff0';
      octx.lineWidth = 2;
      octx.setLineDash([8, 4]);
      octx.beginPath();
      octx.moveTo(0, window._headCutTop);
      octx.lineTo(imgW, window._headCutTop);
      octx.stroke();
      octx.beginPath();
      octx.moveTo(0, window._headCutBottom);
      octx.lineTo(imgW, window._headCutBottom);
      octx.stroke();
      octx.setLineDash([]);
      // Labels
      octx.fillStyle = '#ff0';
      octx.font = '16px monospace';
      octx.fillText('--- HEAD START (horn top) ---', 10, window._headCutTop - 6);
      octx.fillText('--- HEAD END (neck cut) ---', 10, window._headCutBottom + 18);
    }
  }
}

function updateInfo(text) {
  document.getElementById('info').textContent = text;
}

// Load sprite
const img = new Image();
img.crossOrigin = 'anonymous';
img.onload = () => {
  spriteImg = img;
  imgW = img.naturalWidth;
  imgH = img.naturalHeight;

  // Auto-detect body part regions based on sprite proportions.
  // Zani full sprite: full-body character, slightly left-facing.
  // Character center is around 42% from left, head occupies top ~22%.
  const cx = imgW * 0.44;  // character head center x

  // Horn/ears — dark pointed structures at the very top of head
  BODY_REGIONS.horn.rects.push(
    { x: Math.round(cx - imgW*0.10), y: Math.round(imgH*0.005), w: Math.round(imgW*0.06), h: Math.round(imgH*0.055) },  // left horn
    { x: Math.round(cx + imgW*0.04), y: Math.round(imgH*0.000), w: Math.round(imgW*0.06), h: Math.round(imgH*0.06) }    // right horn
  );

  // Hair — white/silver flowing hair, covers top of head, bangs, side locks
  BODY_REGIONS.hair.rects.push(
    { x: Math.round(cx - imgW*0.12), y: Math.round(imgH*0.035), w: Math.round(imgW*0.27), h: Math.round(imgH*0.12) },  // top hair mass
    { x: Math.round(cx - imgW*0.14), y: Math.round(imgH*0.14), w: Math.round(imgW*0.08), h: Math.round(imgH*0.14) },   // left side lock
    { x: Math.round(cx + imgW*0.12), y: Math.round(imgH*0.10), w: Math.round(imgW*0.06), h: Math.round(imgH*0.10) }    // right side hair
  );

  // Head — overall cranium (excluding horns, including top of hair to chin)
  BODY_REGIONS.head.rects.push(
    { x: Math.round(cx - imgW*0.09), y: Math.round(imgH*0.055), w: Math.round(imgW*0.20), h: Math.round(imgH*0.15) }
  );

  // Face — eyes, nose, mouth area (inner portion of head)
  BODY_REGIONS.face.rects.push(
    { x: Math.round(cx - imgW*0.06), y: Math.round(imgH*0.10), w: Math.round(imgW*0.14), h: Math.round(imgH*0.09) }
  );

  // Neck — thin band connecting head to torso
  BODY_REGIONS.neck.rects.push(
    { x: Math.round(cx - imgW*0.03), y: Math.round(imgH*0.205), w: Math.round(imgW*0.08), h: Math.round(imgH*0.035) }
  );

  // Run pixel-level analysis to find character bounding box
  const tempCanvas = document.createElement('canvas');
  tempCanvas.width = imgW;
  tempCanvas.height = imgH;
  const tempCtx = tempCanvas.getContext('2d');
  tempCtx.drawImage(img, 0, 0);
  const pixData = tempCtx.getImageData(0, 0, imgW, imgH).data;

  let cMinX=imgW, cMinY=imgH, cMaxX=0, cMaxY=0;
  for (let y=0; y<imgH; y++) {
    for (let x=0; x<imgW; x++) {
      if (pixData[(y*imgW+x)*4+3] > 20) {
        if (x<cMinX) cMinX=x; if (x>cMaxX) cMaxX=x;
        if (y<cMinY) cMinY=y; if (y>cMaxY) cMaxY=y;
      }
    }
  }
  const cW = cMaxX-cMinX, cH = cMaxY-cMinY;

  // Scan rows to find the head region - look for horizontal extents at various heights
  // Head top: where character starts. Scan down to find where width narrows (neck)
  const rowWidths = [];
  for (let y=cMinY; y<Math.min(cMinY+Math.round(cH*0.35), cMaxY); y++) {
    let rLeft=imgW, rRight=0;
    for (let x=cMinX; x<=cMaxX; x++) {
      if (pixData[(y*imgW+x)*4+3] > 20) {
        if (x<rLeft) rLeft=x;
        if (x>rRight) rRight=x;
      }
    }
    rowWidths.push({y, left:rLeft, right:rRight, width:rRight-rLeft});
  }

  // Find neck: narrowest point in upper portion of character
  // But the hair flows well below the neck, so we scan further down
  let neckIdx = 0, neckWidth = Infinity;
  for (let i=Math.round(rowWidths.length*0.4); i<rowWidths.length; i++) {
    if (rowWidths[i].width > 0 && rowWidths[i].width < neckWidth) {
      neckWidth = rowWidths[i].width;
      neckIdx = i;
    }
  }
  const hairBottomY = Math.min(cMinY + Math.round(cH * 0.19), cMaxY);
  const neckY = rowWidths[neckIdx]?.y || cMinY + cH*0.25;
  const neckLeft = rowWidths[neckIdx]?.left || cMinX;

  // Scan for skin-colored pixels to find face region
  // Skin color detection: look for warm tones (high R, moderate G, lower B)
  let faceMinX=imgW, faceMinY=imgH, faceMaxX=0, faceMaxY=0;
  const headBottom = neckY;
  const headTop = cMinY;
  for (let y=headTop; y<headBottom; y++) {
    for (let x=cMinX; x<=cMaxX; x++) {
      const i = (y*imgW+x)*4;
      const r=pixData[i], g=pixData[i+1], b=pixData[i+2], a=pixData[i+3];
      // Skin tone heuristic: warm, not too dark, not too bright white (hair)
      if (a > 100 && r > 160 && r < 255 && g > 120 && g < 230 && b > 90 && b < 200 && r > b + 20 && r > g - 30) {
        if (x<faceMinX) faceMinX=x; if (x>faceMaxX) faceMaxX=x;
        if (y<faceMinY) faceMinY=y; if (y>faceMaxY) faceMaxY=y;
      }
    }
  }

  // Clear pre-set percentage regions and use pixel-derived ones
  for (const g of Object.values(BODY_REGIONS)) g.rects = [];

  // Now set precise regions based on pixel analysis
  BODY_REGIONS.horn.rects.push(
    { x: cMinX, y: cMinY, w: Math.round(cW*0.5), h: Math.round((faceMinY-cMinY)*0.8) }
  );

  BODY_REGIONS.hair.rects.push(
    { x: cMinX, y: cMinY, w: cW, h: Math.round(headBottom-cMinY) }
  );

  BODY_REGIONS.head.rects.push(
    { x: Math.round(faceMinX - (faceMaxX-faceMinX)*0.15), y: Math.round(cMinY + (faceMinY-cMinY)*0.3),
      w: Math.round((faceMaxX-faceMinX)*1.3), h: Math.round((faceMaxY-cMinY)*1.1) }
  );

  BODY_REGIONS.face.rects.push(
    { x: faceMinX, y: faceMinY, w: faceMaxX-faceMinX, h: faceMaxY-faceMinY }
  );

  BODY_REGIONS.neck.rects.push(
    { x: neckLeft, y: Math.round(neckY - cH*0.01), w: neckWidth, h: Math.round(cH*0.04) }
  );

  // Store horizontal cut lines for the draw function
  window._headCutTop = cMinY;                  // top of horns
  window._headCutBottom = Math.round(hairBottomY);  // bottom of hair/face

  const info = `IMG:${imgW}x${imgH} | HEAD CUT: y=${cMinY} to y=${Math.round(neckY)} | CHAR:(${cMinX},${cMinY})-(${cMaxX},${cMaxY}) ${cW}x${cH}`;
  updateInfo(info);
  document.getElementById('regionList').textContent = JSON.stringify({charBBox:{cMinX,cMinY,cMaxX,cMaxY,cW,cH}, face:{faceMinX,faceMinY,faceMaxX,faceMaxY}, neckY:Math.round(neckY), neckWidth});

  draw();
};
img.onerror = () => updateInfo('Failed to load sprite image');
img.src = SPRITE_URL;

// Manual rectangle drawing on overlay
overlay.addEventListener('mousedown', (e) => {
  const rect = overlay.getBoundingClientRect();
  const scaleX = imgW / rect.width;
  const scaleY = imgH / rect.height;
  drawStart = {
    x: (e.clientX - rect.left) * scaleX,
    y: (e.clientY - rect.top) * scaleY
  };
  isDrawing = true;
});

overlay.addEventListener('mousemove', (e) => {
  if (!isDrawing || !drawStart) return;
  const rect = overlay.getBoundingClientRect();
  const scaleX = imgW / rect.width;
  const scaleY = imgH / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  draw();
  // Preview rectangle
  octx.strokeStyle = '#0f0';
  octx.lineWidth = 2;
  octx.setLineDash([6, 4]);
  octx.strokeRect(drawStart.x, drawStart.y, mx - drawStart.x, my - drawStart.y);
  octx.setLineDash([]);
});

overlay.addEventListener('mouseup', (e) => {
  if (!isDrawing || !drawStart) return;
  isDrawing = false;
  const rect = overlay.getBoundingClientRect();
  const scaleX = imgW / rect.width;
  const scaleY = imgH / rect.height;
  const mx = (e.clientX - rect.left) * scaleX;
  const my = (e.clientY - rect.top) * scaleY;

  const rx = Math.min(drawStart.x, mx);
  const ry = Math.min(drawStart.y, my);
  const rw = Math.abs(mx - drawStart.x);
  const rh = Math.abs(my - drawStart.y);

  if (rw > 5 && rh > 5) {
    BODY_REGIONS[currentGroup].rects.push({ x: Math.round(rx), y: Math.round(ry), w: Math.round(rw), h: Math.round(rh) });
    updateInfo(`Added ${currentGroup} region: (${Math.round(rx)},${Math.round(ry)}) ${Math.round(rw)}x${Math.round(rh)}`);
  }
  drawStart = null;
  draw();
});

// Button controls
document.querySelectorAll('[data-group]').forEach(btn => {
  btn.addEventListener('click', () => {
    currentGroup = btn.dataset.group;
    document.querySelectorAll('[data-group]').forEach(b => b.style.outline = '');
    btn.style.outline = '2px solid #0f0';
  });
});

document.getElementById('btnClear').onclick = () => {
  for (const g of Object.values(BODY_REGIONS)) g.rects = [];
  draw();
  updateInfo('All regions cleared');
};

document.getElementById('btnApply').onclick = (e) => {
  showGreen = !showGreen;
  e.target.classList.toggle('active', showGreen);
  draw();
};

// Expose for DV evaluate
window.BODY_REGIONS = BODY_REGIONS;
window.addRegion = (group, x, y, w, h) => {
  if (BODY_REGIONS[group]) {
    BODY_REGIONS[group].rects.push({ x, y, w, h });
    draw();
    return `Added ${group}: (${x},${y}) ${w}x${h}`;
  }
  return 'Unknown group: ' + group;
};
window.getRegions = () => JSON.stringify(BODY_REGIONS, null, 2);
</script>
</body>
</html>
