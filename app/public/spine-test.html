<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spine Test — Zanni</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a12; display: flex; align-items: center; justify-content: center; min-height: 100vh; }
    #player-container { width: 100vw; height: 100vh; max-width: 800px; }
  </style>
  <link rel="stylesheet" href="https://unpkg.com/@esotericsoftware/spine-player@4.2.109/dist/spine-player.css">
</head>
<body>
  <div id="player-container"></div>
  <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.109/dist/iife/spine-player.js"></script>
  <script>
    new spine.SpinePlayer("player-container", {
      jsonUrl: "/spine/role_zanni/c_zanni_1.json",
      atlasUrl: "/spine/role_zanni/c_zanni_1.atlas",
      animation: "idle",
      loop: true,
      showControls: true,
      backgroundColor: "#0a0a12ff",
      alpha: true,
      premultipliedAlpha: false,
    });
  </script>
</body>
</html>
