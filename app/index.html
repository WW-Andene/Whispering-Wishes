    <!-- Skip navigation for keyboard users (WCAG 2.1 AA) -->
    <a href="#root" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[9999] focus:px-4 focus:py-2 focus:bg-blue-600 focus:text-white focus:rounded-lg focus:text-sm">
      Skip to main content
    </a>
    <!-- Static poster, shown from the very first paint — plain markup, part
         of the same synchronous initial parse as everything else here, so
         there's no gap where html/body's plain navy background is visible
         before the poster appears (that gap is what a React-mounted-only
         poster had: React can't paint anything until the JS bundle has
         fetched/parsed/executed). BootIntro.jsx (mounted alongside <App/>
         in main.jsx) renders the identical poster image at the same
         position on mount, so the handoff from this static one to React's
         is visually seamless — same image, same place, nothing to notice —
         and BootIntro then owns the video/fade sequence from there since
         that needs component state to know when the video has finished. -->
    <!-- Two-piece split, cut at a fixed status-bar-height guess (24px —
         matches BootIntro.jsx's own fallback) — not one element spanning
         the whole screen. MainActivity.java documents the WebView's own
         content-area actually resizing mid-boot as edge-to-edge insets
         settle. Each box below is fixed-size and never recomputed; both
         show the same full-size image, each clipped to its own slice via
         a fixed offset — see BootIntro.jsx's own file-level comment for
         the full rationale (this static poster uses a fixed 24px guess
         rather than the real native value, since MainActivity's
         evaluateJavascript push may not have landed yet this early,
         before React has even mounted). -->
    <script>
      // document.write, not markup + a follow-up script correcting inline
      // styles afterward — a prior version here set width:100% (viewport-
      // relative — the exact thing this whole approach exists to avoid)
      // in the initial markup, then overwrote it with the real fixed px
      // value a moment later. That correction was itself a visible reframe,
      // in the "first poster," independent of anything about the switch to
      // BootIntro.jsx. document.write blocks the parser until it runs, so
      // the fixed pixel dimensions below are the ONLY size these boxes
      // ever have — there's no intermediate percentage-sized state for the
      // parser to paint before a script corrects it.
      (function () {
        var w = window.screen.width, h = window.screen.height, bar = 24;
        // 1px overlap between the bar/page pieces — two independently
        // composited fixed-position layers, exactly abutting at "bar" with
        // zero overlap, can leave a hairline gap on-device (subpixel
        // rounding between the two layers' own compositing, worse on
        // non-integer device pixel ratios) that shows as a thin seam/split
        // right through the poster. The page piece starts 1px earlier and
        // is 1px taller to close that gap; it's the same image content in
        // both pieces, so the 1px overlap is invisible, unlike the gap.
        var overlap = 1;
        var pageTop = bar - overlap;
        var pageH = h - bar + overlap;
        // DIAGNOSTIC: red overlay (mix-blend-mode:multiply, reliable
        // regardless of the poster image's own colors, unlike a CSS
        // filter) — marks THIS static pre-React poster specifically, so
        // on-device it's visually distinguishable from BootIntro.jsx's own
        // React-rendered poster (tinted green). Remove both once the
        // reframe is confirmed fixed.
        var tint = 'position:absolute;top:0;left:0;width:100%;height:100%;background:red;mix-blend-mode:multiply;pointer-events:none';
        document.write(
          '<div id="boot-poster" style="position:fixed;top:0;left:0;width:' + w + 'px;height:' + bar + 'px;overflow:hidden;z-index:2147483647;background:#080c14">' +
            '<img src="./boot-intro/boot-intro-poster.gif" alt="" style="position:absolute;top:0;left:0;width:' + w + 'px;height:' + h + 'px;object-fit:cover" />' +
            '<div style="' + tint + '"></div>' +
          '</div>' +
          '<div id="boot-poster-page" style="position:fixed;top:' + pageTop + 'px;left:0;width:' + w + 'px;height:' + pageH + 'px;overflow:hidden;z-index:2147483647;background:#080c14">' +
            '<img src="./boot-intro/boot-intro-poster.gif" alt="" style="position:absolute;top:' + (-pageTop) + 'px;left:0;width:' + w + 'px;height:' + h + 'px;object-fit:cover" />' +
            '<div style="' + tint + '"></div>' +
          '</div>'
        );
      })();

      // Removes this static poster as soon as MainActivity.java's native
      // code confirms the real "frame switch" moment (edge-to-edge insets
      // settled) instead of waiting on BootIntro.jsx's own mount, which can
      // lag behind it by however long the JS bundle takes to fetch/parse/
      // execute — the gap this poster is up for the reframe to appear in.
      //
      // A prior attempt at this (window.__onBootInsetsReady(), a callback
      // invoked directly from Java-injected JS) reportedly crashed the
      // poster on-device — most likely because evaluateJavascript's own
      // script can run before this function has been defined yet, and
      // calling an undefined global from injected JS throws there rather
      // than anywhere this page's own try/catch can see it. This version
      // only ever reads a boolean (window.__bootInsetsReady) from a plain
      // interval on the page's own side — reading a boolean can't throw,
      // so there's nothing for the previous failure mode to repeat. Wrapped
      // in try/catch anyway, and capped with a fallback timeout in case the
      // native signal never arrives at all (older WebView, injection
      // failure, etc.) so the poster is never stuck up forever.
      (function () {
        var removed = false;
        function removeStaticPoster() {
          if (removed) return;
          removed = true;
          try {
            var bar = document.getElementById('boot-poster');
            var page = document.getElementById('boot-poster-page');
            if (bar) bar.remove();
            if (page) page.remove();
          } catch (e) {
            // Nothing to do — worst case the static poster stays until
            // BootIntro.jsx's own unconditional removal-on-mount runs.
          }
        }
        var pollId = setInterval(function () {
          try {
            if (window.__bootInsetsReady) {
              clearInterval(pollId);
              removeStaticPoster();
            }
          } catch (e) {
            clearInterval(pollId);
          }
        }, 16);
        setTimeout(function () {
          clearInterval(pollId);
          removeStaticPoster();
        }, 2000);
      })();
    </script>
    <div id="root" role="main" aria-label="Whispering Wishes application"></div>
