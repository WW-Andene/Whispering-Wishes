    <!-- Display fonts — Rajdhani (headings/UI) + JetBrains Mono (data numerals) + Cinzel (ceremonial)

         so hover/focus weight animations can interpolate smoothly without
         downloading additional files. Rajdhani on Google Fonts doesn't ship as a
         variable font yet — 5 static weights (300..700) retained for full range.
         Cinzel also bumped to include full weight range for ceremonial emphasis. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Cinzel:wght@400;500;600;700&display=swap" />

    <!-- Skip navigation for keyboard users (WCAG 2.1 AA) -->
    <a href="#root" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[9999] focus:px-4 focus:py-2 focus:bg-blue-600 focus:text-white focus:rounded-lg focus:text-sm">
      Skip to main content
    </a>
    <!-- Static poster, shown from the very first paint — plain markup, part
         of the same synchronous initial parse as everything else here, so
         there's no gap where html/body's plain navy background is visible
         before the poster appears (that gap is what a React-mounted-only
         poster had: React can't paint anything until the JS bundle has
         fetched/parsed/executed). BootIntro.jsx (mounted alongside <App/>
         in main.jsx) renders the identical poster image at the same
         position on mount, so the handoff from this static one to React's
         is visually seamless — same image, same place, nothing to notice —
         and BootIntro then owns the video/fade sequence from there since
         that needs component state to know when the video has finished.

         Overscanned 48px past every edge (inset:-48px, size calc(100% +
         96px)) rather than a plain inset:0 — MainActivity.java documents
         the WebView's content area briefly shrinking by the status/nav
         bar height as Android's edge-to-edge insets settle mid-boot,
         before growing back to the true full-screen size. This poster
         paints on the very first frame, early enough to sometimes catch
         that transient smaller area — visible as a status-bar-height gap
         at the top that isn't there once the video (which only starts
         after buffering, well after the area has settled) takes over.
         Overscanning means the image still fully covers the screen even
         during that shrunk frame — 48px comfortably exceeds any real
         device's status+nav bar height. -->
    <img
      id="boot-poster"
      src="./boot-intro/boot-intro-poster.gif"
      alt=""
      style="position:fixed;top:-48px;left:-48px;right:-48px;bottom:-48px;z-index:9999;width:calc(100% + 96px);height:calc(100% + 96px);object-fit:cover"
    />
    <div id="root" role="main" aria-label="Whispering Wishes application"></div>
    <noscript><p role="alert" style="color:#fff;text-align:center;padding:2rem;font-family:sans-serif;background:#080c14;min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center">Whispering Wishes requires JavaScript to run.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
  </body>
