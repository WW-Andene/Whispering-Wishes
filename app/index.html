    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.webmanifest" />
    <!-- Display fonts — Rajdhani (headings/UI) + JetBrains Mono (data numerals) + Cinzel (ceremonial)
         DT-09 audit fix: JetBrains Mono now loaded as a variable font (wght@100..800)
         so hover/focus weight animations can interpolate smoothly without
         downloading additional files. Rajdhani on Google Fonts doesn't ship as a
         variable font yet — 5 static weights (300..700) retained for full range.
         Cinzel also bumped to include full weight range for ceremonial emphasis. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preload" as="style" href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Cinzel:wght@400;500;600;700&display=swap" />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet" media="print" onload="this.media='all'" />
    <!-- Atkinson Hyperlegible — self-hosted for CSP compatibility -->
    <link rel="dns-prefetch" href="https://i.ibb.co" />
    <link rel="dns-prefetch" href="https://i.imgur.com" />
    <link rel="dns-prefetch" href="https://cdn.discordapp.com" />
    <!-- Spine player runtime (IIFE) — loaded from CDN for WebGL texture compatibility.
         P3-02 audit fix: Subresource Integrity hashes pinned to version 4.2.109.
         Regenerate on version bump:
           curl -sSL "<url>" | openssl dgst -sha384 -binary | openssl base64 -A -->
    <link rel="stylesheet"
          href="https://unpkg.com/@esotericsoftware/spine-player@4.2.109/dist/spine-player.css"
          integrity="sha384-SAzRnvZaanzeQyV9076wVkiVpz8Ps2uicu0yff7GJdBU2Pr65zYUg5tYbXT8Uzaz"
          crossorigin="anonymous" />
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.2.109/dist/iife/spine-player.js"
            integrity="sha384-C2uhee9ZK7jve2lChHRuBQ0OqZjzZSNaxmRiBY9Y0fHA6yFLUZjPQyE7ogX3kJZg"
            crossorigin="anonymous"></script>
    <!-- Secondary spine-player runtime @4.1.55 for Spine 4.1-exported assets
         (e.g. sprite-spine portraits from nanoka). Spine runtimes are not
         backward-compatible across minor versions, so the 4.2 runtime above
         cannot read a 4.1 .skel. We stash 4.2's globals, let 4.1 install onto
         window.spine, then capture as window.spine41 and restore 4.2. Both
         runtimes are loaded synchronously so SpinePlayer never has to wait
         for a "ready" signal.
         SRI regenerated via:
           curl -sSL "<url>" | openssl dgst -sha384 -binary | openssl base64 -A -->
    <script>window.__spine42 = window.spine; window.spine = undefined;</script>
    <script src="https://unpkg.com/@esotericsoftware/spine-player@4.1.55/dist/iife/spine-player.js"
            integrity="sha384-JmJJLCJBXRw87w7ce9AOcL7EqR8Km9mzuu0MDsbSaceHZEeB+0QstgcQ6a076u8Q"
            crossorigin="anonymous"></script>
    <script>window.spine41 = window.spine; window.spine = window.__spine42; delete window.__spine42;</script>
    <noscript>
      <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@300;400;500;600;700&family=JetBrains+Mono:ital,wght@0,100..800;1,100..800&family=Cinzel:wght@400;500;600;700&display=swap" rel="stylesheet" />
    </noscript>
    <style>html,body{background:#080c14;color:#e2e8f0;margin:0}</style>
    <!-- Design system CSS (extracted from KuroStyles.jsx — OLED overrides via .oled-mode class) -->
    <link rel="stylesheet" href="/src/styles/kuro.css" />

  </head>

    <!-- Skip navigation for keyboard users (WCAG 2.1 AA) -->
    <a href="#root" class="sr-only focus:not-sr-only focus:fixed focus:top-2 focus:left-2 focus:z-[9999] focus:px-4 focus:py-2 focus:bg-blue-600 focus:text-white focus:rounded-lg focus:text-sm">
      Skip to main content

    <!-- Boot splash screen — visible while JS loads, fades out when app renders -->
    <div id="splash" style="position:fixed;inset:0;z-index:99999;background:#080c14;display:flex;align-items:center;justify-content:center;transition:opacity 0.4s ease">
      <img src="./splash.jpg" alt="" style="width:100%;height:100%;object-fit:cover" />
    </div>
    <div id="root" role="main" aria-label="Whispering Wishes application"></div>
    <noscript><p role="alert" style="color:#fff;text-align:center;padding:2rem;font-family:sans-serif;background:#080c14;min-height:100vh;margin:0;display:flex;align-items:center;justify-content:center">Whispering Wishes requires JavaScript to run.</p></noscript>
    <script type="module" src="/src/main.jsx"></script>
